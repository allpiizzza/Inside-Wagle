<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>와글와글 인사이드</title>
    <meta name="og:description" content="🥰 모든 와글이 행복한 2026년을 보내길 🥰">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #37352f;
            padding: 15px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: radial-gradient(ellipse at 20% 10%, #fff6e0 0%, #fdfbf7 40%, #f3f0ff 100%);
        }

        /* 배경에 둥둥 떠있는 글로시 감정 구슬들 */
        .float-orb {
            position: absolute;
            border-radius: 50%;
            animation-name: floaty;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }
        @keyframes floaty {
            0%   { transform: translateY(0px) translateX(0px); }
            100% { transform: translateY(-18px) translateX(8px); }
        }

        .landing-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(108, 92, 231, 0.12);
            border: 2px solid #ffffff;
            width: 100%;
            max-width: 340px;
            box-sizing: border-box;
            text-align: center;
        }
        .landing-emoji {
            font-size: 44px;
            margin-bottom: 8px;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 20px;
            color: #4a3f8a;
            letter-spacing: -0.3px;
        }
        .subtitle {
            font-size: 13px;
            color: #9b8fc7;
            margin-bottom: 30px;
            line-height: 1.6;
            font-weight: 500;
        }
        .btn-register {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            margin-bottom: 10px;
            transition: transform 0.15s ease;
        }
        .btn-register:active {
            transform: scale(0.97);
        }
        .btn-register:last-child {
            margin-bottom: 0;
        }

        .btn-review   { background: linear-gradient(135deg, #ffe066, #ffd700); color: #6b5100; box-shadow: 0 6px 16px rgba(255, 215, 0, 0.35); }
        .btn-quest    { background: linear-gradient(135deg, #a370f7, #6c5ce7); color: #fff; box-shadow: 0 6px 16px rgba(108, 92, 231, 0.35); }
        .btn-freedom  { background: linear-gradient(135deg, #6ba6e8, #4a90e2); color: #fff; box-shadow: 0 6px 16px rgba(74, 144, 226, 0.35); }
        .btn-fortune  { background: linear-gradient(135deg, #7bc97b, #5cb85c); color: #fff; box-shadow: 0 6px 16px rgba(92, 184, 92, 0.35); }
        .btn-macau    { background: linear-gradient(135deg, #ea7b83, #e15b64); color: #fff; box-shadow: 0 6px 16px rgba(225, 91, 100, 0.35); }

        /* 팀 점수 전광판 (막대그래프) */
        .scoreboard {
            margin: 6px 0 22px;
            padding: 14px 14px 16px;
            background: rgba(118, 92, 231, 0.06);
            border: 1px solid #ece6fb;
            border-radius: 16px;
            text-align: left;
        }
        .board { display: flex; flex-direction: column; gap: 9px; }
        .bar-row { display: flex; align-items: center; gap: 8px; }
        .bar-row .tname {
            width: 42px;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .bar-track {
            flex: 1;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 7px;
            height: 18px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0;
            border-radius: 7px;
            transition: width 1.1s cubic-bezier(.22,1,.36,1);
        }
        .bar-row .tscore {
            width: 40px;
            text-align: right;
            font-size: 12px;
            font-weight: 800;
            color: #37352f;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }
        .board-msg { font-size: 12px; color: #9b8fc7; text-align: center; padding: 8px 0; }
        .board-msg.error { color: #c0392b; }
    </style>
</head>
<body>

    <script>
        const colors = ['#ffd700', '#4a90e2', '#e15b64', '#a370f7', '#5cb85c', '#fd79a8', '#00cec9', '#e1b12c'];
        for (let i = 0; i < 60; i++) {
            const orb = document.createElement('div');
            orb.className = 'float-orb';
            const size = 14 + Math.random() * 36;
            const color = colors[Math.floor(Math.random() * colors.length)];
            orb.style.width = size + 'px';
            orb.style.height = size + 'px';
            orb.style.left = Math.random() * 94 + 'vw';
            orb.style.top = Math.random() * 94 + 'vh';
            orb.style.background = `radial-gradient(circle at 30% 30%, #ffffff 0%, ${color} 75%)`;
            orb.style.boxShadow = `inset -4px -4px 8px rgba(0,0,0,0.15), inset 3px 3px 6px rgba(255,255,255,0.6), 0 0 ${Math.round(size * 0.6)}px ${color}55`;
            orb.style.opacity = (0.55 + Math.random() * 0.3).toFixed(2);
            orb.style.animationDuration = (2 + Math.random() * 1.5) + 's';
            orb.style.animationDelay = (Math.random() * 2) + 's';
            document.body.appendChild(orb);
        }
    </script>

    <div class="landing-card">
        <div class="landing-emoji">🔮</div>
        <h1>인사이드 와글</h1>
        <div class="subtitle">2026 하반기 이벤트<br>와글과 함께 기억구슬 모으기</div>

        <div class="scoreboard">
            <div class="board" id="board"><div class="board-msg">점수 불러오는 중…</div></div>
        </div>

        <a class="btn-register btn-review" href="registerMarble.html">📖 기억구슬 자판기</a>
        <a class="btn-register btn-quest" href="quests.html">🎯 퀘스트 클리어</a>
        <a class="btn-register btn-freedom" href="freedom.html">⏰ 프리덤 타임</a>
        <a class="btn-register btn-fortune" href="fortuneteller.html">🥠 와글의 운세</a>
        <a class="btn-register btn-macau" href="insidemacau.html">🎰 와글노름꾼</a>
    </div>

    <script>
        const API_TEAM_SCORES = '/api/teamScores';
        const TEAM_COLORS = {
            '생글이': '#f5c33b', // 노랑
            '당당이': '#8fce5a', // 연두
            '불끈이': '#e86a6a', // 빨강
            '포근이': '#5aa0e6', // 파랑/하늘
            '중심이': '#9b7ff0', // 보라
        };
        function colorFor(name) {
            const k = Object.keys(TEAM_COLORS).find((k) => name.includes(k));
            return k ? TEAM_COLORS[k] : '#6c5ce7';
        }
        function renderBoard(teams) {
            const board = document.getElementById('board');
            if (!Array.isArray(teams) || teams.length === 0) {
                board.innerHTML = '<div class="board-msg">아직 집계된 점수가 없어요.</div>';
                return;
            }
            const max = Math.max(...teams.map((t) => t.total), 1);
            board.innerHTML = '';
            teams.forEach((t) => {
                const color = colorFor(t.team);
                const label = t.team.replace(/팀$/, ''); // "생글이팀" → "생글이"
                const row = document.createElement('div');
                row.className = 'bar-row';
                row.innerHTML = `
                    <div class="tname" style="color:${color}">${label}</div>
                    <div class="bar-track"><div class="bar-fill" style="background:${color}"></div></div>
                    <div class="tscore">${t.total.toLocaleString()}</div>`;
                board.appendChild(row);
                requestAnimationFrame(() => {
                    row.querySelector('.bar-fill').style.width = ((t.total / max) * 100) + '%';
                });
            });
        }
        async function loadBoard() {
            try {
                const res = await fetch(API_TEAM_SCORES);
                const ct = res.headers.get('content-type') || '';
                if (!ct.includes('application/json')) {
                    throw new Error('전광판 API(/api/teamScores) 응답이 JSON이 아니에요. 배포/구동 상태를 확인해주세요.');
                }
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '불러오기 실패');
                renderBoard(data);
            } catch (err) {
                document.getElementById('board').innerHTML =
                    `<div class="board-msg error">${err.message}</div>`;
            }
        }
        loadBoard();
        setInterval(loadBoard, 600000); // 10분마다 새로고침
    </script>

</body>
</html>
