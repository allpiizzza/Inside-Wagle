<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>와글와글 인사이드</title>
    <meta name="og:description" content="🥰 모든 와글이 행복한 2026년을 보내길 🥰">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fdfbf7;
            color: #37352f;
            padding: 15px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .landing-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 36px 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #edece9;
            width: 100%;
            max-width: 340px;
            box-sizing: border-box;
            text-align: center;
        }
        .landing-emoji {
            font-size: 40px;
            margin-bottom: 6px;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 19px;
            color: #222;
        }
        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .btn-register {
            display: inline-block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: #37352f;
            color: #fff;
            text-decoration: none;
            box-sizing: border-box;
            transition: transform 0.15s ease, background 0.2s ease;
        }
        .btn-register:hover {
            background: #22201c;
        }
        .btn-register:active {
            transform: scale(0.97);
        }
        .btn-quest {
            background: #6c5ce7;
            margin-top: 10px;
        }
        .btn-quest:hover {
            background: #5a4bd1;
        }
    </style>
</head>
<body>

<div class="landing-card">
    <div class="landing-emoji">🔮</div>
    <h1>인사이드 와글</h1>
    <div class="subtitle">2026 하반기 이벤트<br>와글과 함께 기억구슬 모으기</div>
    <a class="btn-register" href="registerMarble.html">📖 책후기 등록하기</a>
    <a class="btn-register btn-quest" href="quests.html">🎯 퀘스트 인증하기</a>
    <a class="btn-register" style="background:#37352f; margin-top:10px;" href="freedom.html">⏰ 프리덤 독서 기록</a>
</div>

</body>
</html>
