<!DOCTYPE html>

        * { box-sizing: border-box; }

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #2b1055 0%, #6c5ce7 50%, #a8c0ff 100%);
            color: #37352f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* 신비로운 별/달/구슬 장식 */
        .float-mystic {
            position: absolute;
            font-size: 20px;
            opacity: 0.55;
            animation-name: floaty;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes floaty {
            0%   { transform: translateY(0px) translateX(0px); }
            100% { transform: translateY(-16px) translateX(6px); }
        }

        .widget-container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(43, 16, 85, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.7);
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }

        .back-link {
            font-size: 12px;
            color: #888;
            text-decoration: none;
            display: block;
            text-align: left;
            margin-bottom: 4px;
        }

        .header { margin-bottom: 20px; }

            font-size: 18px;
            color: #2c3e50;
            margin: 0 0 6px 0;
            background: linear-gradient(to right, #6c5ce7, #ff7675);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .header p { font-size: 12px; color: #888; margin: 0; font-weight: 600; }

        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 12px; font-weight: 700; color: #555; margin-bottom: 6px; }

        select {
            width: 100%;
            padding: 9px 10px;
            border: 1.5px solid #edece9;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            background-color: #fff;
            font-weight: 600;
            color: #222;
            transition: border-color 0.2s ease;
        }

        select:focus { border-color: #6c5ce7; }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #a370f7, #6c5ce7);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(108, 92, 231, 0.35);
            transition: transform 0.15s ease;
        }

        button:active { transform: scale(0.97); }
        button:disabled {
            background: #e2e1de;
            color: #a09f9c;
            box-shadow: none;
            cursor: not-allowed;
        }

        .result-card {
            margin-top: 20px;
            padding: 20px;
            border-radius: 14px;
            background: #fff;
            border: 2px solid #edece9;
            display: none;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: left;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            color: white;
            margin-bottom: 12px;

            background-color: #faf9f6;
            border-left: 4px solid #a29bfe;
            padding: 10px 14px;
            font-style: italic;
            font-size: 12px;
            color: #4a5568;
            margin-top: 6px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .special-ticket {
            margin-top: 16px;
            padding: 14px;
            background: linear-gradient(135deg, #ffeaa7, #fab1a0);
            border: 2px dashed #d63031;
            border-radius: 12px;
            text-align: center;
            font-weight: 800;
            color: #d63031;
            font-size: 14px;
            display: none;
            animation: bounce 0.6s ease infinite alternate;
        }

            from { transform: translateY(0); }

        .theme-생글이 { border-color: var(--joy-main); background-color: var(--joy-bg); }
        .badge-생글이 { background-color: var(--joy-main); color: #333; }

        .badge-불끈이 { background-color: var(--anger-main); }
    </style>
</head>

    // 브라우저의 로컬 타임존이 이미 KST일 경우 9시간이 중복 적용돼서 하루가 밀리는 버그가 있었음.
    // toISOString()은 항상 UTC 기준으로 문자열을 만들기 때문에, "UTC시간+9시간"을 그 방식으로 읽으면
    // 로컬 타임존과 무관하게 정확한 KST 날짜를 얻을 수 있음.
    function getKstDateParts() {
        const now = new Date();
        const kstOffset = 9 * 60 * 60 * 1000;
        const kstShifted = new Date(now.getTime() + kstOffset);
        const isoDate = kstShifted.toISOString().split('T')[0]; // YYYY-MM-DD (KST 기준 날짜)
        const [year, month, day] = isoDate.split('-');
        return { isoDate, year, month, day };
    }

    // 1. 구글 시트 데이터 가져오기
    async function loadGoogleSheetData() {
        const btn = document.getElementById('fortuneBtn');
        const originalBtnText = btn.innerText;
        btn.disabled = true;
        btn.innerText = '불러오는 중...';

    // 2. 일일 고정 난수 생성 함수
    function seededRandom(seedString) {
        let hash = 0;
        for (let i = 0; i < seedString.length; i++) {
            hash = ((hash << 5) - hash) + seedString.charCodeAt(i);
            hash = hash & hash;
        }
        let random = (Math.sin(hash) * 10000) % 1;
        return random < 0 ? random + 1 : random;
    }

    // 3. 운세 뽑기 실행 함수
    function generateFortune() {
        if (quotesData.length === 0 || itemsData.length === 0) {
            alert("아직 데이터를 불러오는 중입니다. 잠시 후 다시 시도해주세요.");
            return;
        }

        const selectedMember = document.getElementById('memberSelect').value;
        if (!selectedMember) {
            alert("✨ 먼저 닉네임을 선택해 주세요!");
            return;
        }

        const memberInfo = members[selectedMember];

        // 오늘 날짜 가져오기 (KST 기준, 위와 동일한 헬퍼 사용)
        const today = getKstDateParts().isoDate;

        // '멤버이름 + 오늘날짜'를 시드로 설정
        const seed = selectedMember + today;

        const valueRandom = seededRandom(seed + "_value");
        const quoteRandom = seededRandom(seed + "_quote");
        const itemRandom = seededRandom(seed + "_item");

        const todayValue = memberInfo.values[Math.floor(valueRandom * memberInfo.values.length)];
        const selectedQuote = quotesData[Math.floor(quoteRandom * quotesData.length)];
        const selectedItem = itemsData[Math.floor(itemRandom * itemsData.length)];

        // A열 데이터 가져오기 및 \n 기호와 실제 줄바꿈을 <br> 태그로 변환
        let rawQuote = selectedQuote.nickname || selectedQuote.text || "";
        let rawItem = selectedItem.name || selectedItem.desc || "";

        const quoteText = rawQuote.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
        const itemText = rawItem.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');

        // UI 요소 가져오기
        const resultCard = document.getElementById('resultCard');
        const teamBadge = document.getElementById('teamBadge');
        const resultTitle = document.getElementById('resultTitle');
        const valMsg = document.getElementById('valMsg');
        const quoteMsg = document.getElementById('quoteMsg');
        const keywordMsg = document.getElementById('keywordMsg');
        const itemMsg = document.getElementById('itemMsg');
        const ticketBox = document.getElementById('ticketBox');

        // 값 적용하기
        teamBadge.innerText = memberInfo.team;

        // 상단 타이틀과 동일한 날짜 형식으로 세팅
        const dateStr = getTodayFormatted();
        resultTitle.innerText = `🔮 ${dateStr} ${selectedMember}님의 가치 운세 🔮`;

        valMsg.innerText = `오늘은 '${todayValue}'의 에너지가 당신을 감싸는 하루입니다!`;
        keywordMsg.innerText = `[ ${todayValue} ]`;

        // 브라우저가 <br>을 진짜 줄바꿈으로 인식하도록 innerHTML 사용
        quoteMsg.innerHTML = quoteText;
        itemMsg.innerHTML = itemText;

        // 💡 약 10% 확률로 럭키 이용권 당첨 로직 (하루에 한 번 고정)
        const ticketChanceRandom = seededRandom(seed + "_ticketChance");
        if (ticketChanceRandom < 0.10) {
            const ticketPickRandom = seededRandom(seed + "_ticketPick");
            const ticketName = tickets[Math.floor(ticketPickRandom * tickets.length)];
            document.getElementById('ticketName').innerText = ticketName;
            ticketBox.style.display = 'block';
        } else {
            ticketBox.style.display = 'none';
        }

        // 팀별 테마 클래스 적용 (기존 클래스 덮어쓰기)
        resultCard.className = `result-card theme-${memberInfo.team}`;
        teamBadge.className = `badge badge-${memberInfo.team}`;

        // 결과 카드 보여주기
        resultCard.style.display = 'block';
    }

    // 결과 카드 내용을 조합해서 공유하기 (지원 안 되면 복사로 대체)
    function shareResult() {
        const title = document.getElementById('resultTitle').innerText;
        const team = document.getElementById('teamBadge').innerText;
        const val = document.getElementById('valMsg').innerText;
        const quote = document.getElementById('quoteMsg').innerText;
        const keyword = document.getElementById('keywordMsg').innerText;
        const item = document.getElementById('itemMsg').innerText;
        const ticket = document.getElementById('ticketBox').style.display === 'block'
            ? `\n🎉 럭키 찬스 당첨! ${document.getElementById('ticketName').innerText}`
            : '';

        const text = `${title}\n(${team})\n\n🍀 오늘의 행운 운세\n${val}\n\n🕯️ 오늘의 철학 한 줄\n${quote}\n\n🔑 행운의 독서 키워드\n${keyword}\n\n🎁 오늘의 독서 아이템\n${item}${ticket}`;

        const copyBtn = document.getElementById('copyBtn');
        const flashMessage = (msg) => {
            const original = copyBtn.innerText;
            copyBtn.innerText = msg;
            setTimeout(() => { copyBtn.innerText = original; }, 1500);
        };

        // 1순위: 모바일 브라우저의 네이티브 공유 시트 (카카오톡 등으로 바로 공유 가능)
        if (navigator.share) {
            navigator.share({ title: '와글의 운세', text }).catch(() => {
                // 사용자가 공유를 취소한 경우 등은 조용히 무시
            });
            return;
        }

        // 2순위: 공유가 지원되지 않는 환경(주로 데스크탑)에서는 클립보드 복사로 대체
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
                .then(() => flashMessage('복사됐어요! ✅'))
                .catch(() => fallbackCopy(text, () => flashMessage('복사됐어요! ✅')));
        } else {
            fallbackCopy(text, () => flashMessage('복사됐어요! ✅'));
        }
    }

    // 클립보드 API를 지원하지 않는 구형 브라우저용 대체 복사 방식
    function fallbackCopy(text, onSuccess) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
            document.execCommand('copy');
            onSuccess();
        } catch (err) {
            alert('복사에 실패했어요. 직접 선택해서 복사해주세요.');
        }
        document.body.removeChild(textarea);
    }

    // 창이 로드될 때 데이터 불러오기
    // 스크립트는 body 맨 아래에 있어 이 시점에 DOM은 이미 준비돼있음.
    // window.onload(이미지/폰트 등 모든 리소스 로딩 완료)까지 기다리지 않고 바로 데이터 요청 시작.
    loadGoogleSheetData();
</script>
