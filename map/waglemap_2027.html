<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>와글 지도 — The Wagle's Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="subwaySchematic.js"></script><!-- window.SUBWAY_SCHEMATIC = { w, h, stations:{역명:[x,y]} } -->
    <style>
        * { box-sizing: border-box; }
        :root {
            --ink: #3a2a18;
            --ink-soft: #5f4a34;
            --ink-faint: #8a7555;
            --parch-1: #efe0bb;
            --parch-2: #e3d0a6;
            --parch-3: #cdb382;
            --edge: #7a5c38;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--ink);
            padding: 15px;
            min-height: 100vh;
            min-height: 100dvh;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(60,38,15,0) 55%, rgba(60,38,15,.35) 100%),
                radial-gradient(ellipse at 20% 15%, #e9d8b0 0%, #ddc99f 45%, #c6a975 100%);
            background-attachment: fixed;
        }

        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
            background:
                radial-gradient(ellipse at 30% 10%, #f3e7c6 0%, #e9d7ac 45%, #d8bd8c 100%);
            border: 2px solid var(--edge);
            border-radius: 6px;
            box-shadow:
                0 0 0 7px #e9d7ac,
                0 0 0 9px var(--edge),
                inset 0 0 90px 24px rgba(90,60,25,.28),
                0 24px 50px rgba(50,32,12,.45);
            padding: 26px 24px;
        }
        /* 모서리 그을림 */
        .app::before {
            content: ""; position: absolute; inset: 0; border-radius: 6px; pointer-events: none;
            box-shadow: inset 0 0 70px 10px rgba(70,45,18,.35);
            background:
                radial-gradient(circle at 0 0, rgba(60,38,15,.5), transparent 16%),
                radial-gradient(circle at 100% 0, rgba(60,38,15,.5), transparent 16%),
                radial-gradient(circle at 0 100%, rgba(60,38,15,.5), transparent 16%),
                radial-gradient(circle at 100% 100%, rgba(60,38,15,.5), transparent 16%);
        }

        .back-link { font-size: 12px; color: var(--ink-faint); text-decoration: none; display: inline-block; margin-bottom: 8px; font-weight: 700; letter-spacing: .3px; }
        .back-link:hover { color: var(--ink); }

        .topbar { margin-bottom: 18px; text-align: center; border-bottom: 2px double var(--edge); padding-bottom: 14px; }
        .topbar h1 {
            margin: 0 0 6px 0; font-size: 30px; font-weight: 400; letter-spacing: .5px;
            font-family: "IM Fell English SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--ink);
            text-shadow: 0 1px 0 rgba(255,250,235,.5);
        }
        .topbar .sub-ko { margin: 0 0 6px; font-size: 15px; color: var(--ink-soft); font-weight: 700; }
        .topbar p { margin: 0; font-size: 12.5px; color: var(--ink-faint); font-weight: 700; line-height: 1.6; font-style: italic; }
        .oath { font-family: "IM Fell English", serif; font-style: italic; }

        .card {
            background: rgba(120, 85, 40, 0.10);
            border: 1.5px solid var(--edge);
            border-radius: 5px;
            padding: 16px;
            box-shadow: inset 0 0 30px rgba(90,60,25,.12);
        }
        .card h2 { margin: 0 0 10px; font-size: 15px; color: var(--ink); font-weight: 800; }
        .card h2 .muted { font-weight: 400; }

        input, button, select { font-size: 14px; font-family: inherit; }
        input, select {
            padding: 9px 11px; border: 1.5px solid var(--edge); border-radius: 4px;
            background: #f6ecd2; color: var(--ink);
        }
        input:focus, select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 2px rgba(122,92,56,.3); }
        button {
            padding: 10px 18px; border: 1.5px solid var(--ink); border-radius: 4px; font-weight: 800; cursor: pointer;
            background: linear-gradient(#6b5236, #4a371f); color: #f3e7c6; letter-spacing: .5px;
            box-shadow: 0 3px 7px rgba(50,32,12,.4); transition: transform .15s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        button:active { transform: scale(0.97); }
        button.sm { padding: 4px 10px; font-size: 12px; border-radius: 4px; background: #c9b083; color: var(--ink); box-shadow: none; border-color: var(--edge); }
        button:disabled { background: #b7a888; color: #e9ddc2; box-shadow: none; cursor: default; border-color: #a2916e; }

        .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
        #rsPerson { flex: 0 1 130px; }
        #rsLabel  { flex: 0 1 130px; }
        .searchbox { position: relative; flex: 1 1 180px; }
        .searchbox input { width: 100%; }
        .dropdown {
            position: absolute; left: 0; right: 0; top: 100%; z-index: 1000; background: #f6ecd2;
            border: 1.5px solid var(--edge); border-radius: 0 0 4px 4px; max-height: 240px; overflow-y: auto;
            box-shadow: 0 8px 20px rgba(50,32,12,.3); display: none;
        }
        .dropdown.open { display: block; }
        .dropdown .opt { padding: 8px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .dropdown .opt:hover { background: #e9d7ac; }
        .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; border: 1px solid rgba(58,42,24,.5); }
        ul { list-style: none; margin: 0; padding: 0; }
        .list-toggle { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
            font-size: 13px; font-weight: 800; color: var(--ink); user-select: none;
            background: #d9c193; border: 1.5px solid var(--edge); border-radius: 4px; padding: 7px 12px;
            transition: background .15s ease; }
        .list-toggle:hover { background: #cfb482; }
        .list-toggle:active { transform: scale(0.98); }
        .list-toggle .chev { display: inline-flex; align-items: center; justify-content: center;
            width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: #f3e7c6;
            font-size: 11px; line-height: 1; transition: transform .2s ease; }
        .list-toggle.collapsed .chev { transform: rotate(-90deg); }
        #rsList { max-height: 220px; overflow-y: auto; padding-right: 4px; margin-top: 8px; }
        #rsList.collapsed { display: none; }
        li { display: flex; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px solid rgba(122,92,56,.35); font-size: 14px; }
        li .grow { flex: 1; }
        .tag { font-size: 11px; background: #d9c193; color: var(--ink); padding: 1px 8px; border-radius: 10px; font-weight: 700; border: 1px solid var(--edge); }
        .muted { color: var(--ink-faint); font-size: 13px; }
        .err { color: #9b2d1f; font-weight: 700; }
        .banner { background: #f5e2b8; border: 1.5px solid #b98a3c; color: #7a4e12; padding: 10px 12px; border-radius: 5px; margin-bottom: 14px; font-size: 13px; }
        #status { font-size: 12px; color: var(--ink-faint); margin-top: 8px; font-style: italic; }

        /* 라벨 표시 토글 */
        .label-filters { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
        .label-filters .lf-label { font-size: 12px; font-weight: 800; color: var(--ink); margin-right: 2px; }
        #labelFilters { display: inline-flex; flex-wrap: wrap; gap: 6px; }
        .lf-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
            cursor: pointer; font-size: 12.5px; font-weight: 800; border: 1.5px solid var(--edge); user-select: none;
            transition: transform .12s ease; background: #f6ecd2; color: var(--ink-faint); }
        .lf-chip:active { transform: scale(0.96); }
        .lf-chip .d { width: 10px; height: 10px; border-radius: 50%; }

        /* 도식 노선도(와글의 지도) */
        #map {
            width: 100%; height: 70vh; min-height: 460px; margin-top: 18px;
            border-radius: 5px; overflow: hidden;
            background: #d8bd8c;
            position: relative; z-index: 0;
            border: 2px solid var(--edge);
            box-shadow: inset 0 0 40px rgba(70,45,18,.3);
        }
        /* 지도 테두리 그을림 비네트 (핀=markerPane z600 보다 아래) */
        #map::after {
            content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 500; border-radius: inherit;
            box-shadow: inset 0 0 110px 34px rgba(62,40,16,.55);
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(62,40,16,.28) 100%);
        }
        .leaflet-container { background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        /* 디멘터 유령: 둥둥 떠다니기 */
        @keyframes wgfloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }
        .wg-ghost { animation: wgfloat 2.6s ease-in-out infinite; opacity: .92; }
        /* 네모칸 상단 해골: 느리게 위아래로 */
        @keyframes wgbob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-5px); }
        }
        .wg-skull { animation: wgbob 4s ease-in-out infinite; }

        /* 역 이름 클릭 팝업 (양피지 테마) */
        .wg-pop .leaflet-popup-content-wrapper {
            background: radial-gradient(ellipse at 30% 20%, #f8eecd 0%, #e6d2a4 100%);
            color: #3a2a18; border: 1.5px solid #4a4a4a; border-radius: 4px;
            box-shadow: 0 4px 12px rgba(50,32,12,.45);
        }
        .wg-pop .leaflet-popup-content {
            margin: 7px 12px; font-weight: 800; font-size: 13px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .wg-pop .leaflet-popup-tip { background: #ecdcb2; border: 1.5px solid #4a4a4a; box-shadow: none; }

        .footer-oath {
            text-align: center; margin-top: 16px; font-family: "IM Fell English", serif; font-style: italic;
            color: var(--ink-soft); font-size: 14px; letter-spacing: .4px;
        }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .app { padding: 16px 14px; }
            .topbar h1 { font-size: 23px; }
            .row { gap: 6px; }
            #rsPerson, #rsLabel, .searchbox { flex: 1 1 100%; }
            #rsPerson, #rsLabel, .searchbox input { width: 100%; }
            #saveBtn { width: 100%; }
            #map { height: 58vh; min-height: 320px; }
            #rsList { max-height: 160px; }
        }
    </style>
</head>
<body>
<div class="app">
    <a class="back-link" href="https://for-wagle.vercel.app/">← For Wagle</a>
    <div class="topbar">
        <h1>The Wagle&rsquo;s Map</h1>
        <p class="sub-ko">나는 천하의 멍텅구리임을 엄숙하게 선언합니다</p>
        <p class="oath">&ldquo;I solemnly swear that I am up to no good&rdquo;</p>
    </div>

    <div id="setupBanner" class="banner" style="display:none"></div>

    <div class="card">
        <h2>등록 <span class="muted">이름 · 역 · 라벨 (기존 이름·라벨에 저장하면 덮어쓰기)</span></h2>
        <div class="row">
            <select id="rsPerson"><option value="">이름 선택</option></select>
            <select id="rsLabel"><option value="">라벨 선택</option></select>
            <div class="searchbox">
                <input id="rsSearch" placeholder="역 이름 검색 (예: 강남)" autocomplete="off" oninput="onSearchInput()">
                <div id="searchResults" class="dropdown"></div>
            </div>
            <button id="saveBtn" onclick="saveResident()" disabled>저장</button>
        </div>
        <span id="rsMsg" class="muted"></span>
        <div class="list-toggle collapsed" id="listToggle" onclick="toggleList()">
            <span class="chev">▾</span> 거주지 목록 <span id="listCount" class="muted"></span>
        </div>
        <ul id="rsList" class="collapsed"></ul>
        <div id="status"></div>
    </div>

    <div class="label-filters">
        <span class="lf-label">지도 표시</span>
        <span id="labelFilters"></span>
    </div>

    <div id="map"></div>

    <div class="footer-oath">✦ Mischief Managed ✦</div>
</div>

<script>
/* ============================================================
   설정 — 이 두 값만 채우면 됩니다
   ============================================================ */
const API_URL     = 'https://script.google.com/macros/s/AKfycbw42FiGd05ufy8u7AgQnQrBSEAM5X6x-9nv7HnTSrdAH47L7jYJ29rSGpwcV7TgmXk2Aw/exec';
const WRITE_TOKEN = 'wagle-write-token'; // Apps Script 의 WRITE_TOKEN 과 동일하게

/* 디멘터: 이름 박스 없이 둥둥 떠다니는 👻 로 표시하는 특수 라벨 */
const DEMENTOR = '디멘터';
const isDementor = l => String(l || '').trim() === DEMENTOR;

/* 라벨별 색상(양피지 잉크 톤): 지정 라벨은 고정색, 그 외는 팔레트에서 자동 배정 */
const LABEL_COLORS = { '집': '#a8742f', '직장': '#4f6d86', '루모스': '#F5EBB3', '디멘터': '#000000' };
const LABEL_FALLBACK = ['#7d4a86', '#b06a1e', '#2f6d63', '#6d4c41', '#394b8a', '#2f6a7d', '#9b3a56', '#4d3a7d'];
const labelColorMap = {};
function labelColor(label) {
    if (LABEL_COLORS[label]) return LABEL_COLORS[label];
    if (!(label in labelColorMap)) labelColorMap[label] = LABEL_FALLBACK[Object.keys(labelColorMap).length % LABEL_FALLBACK.length];
    return labelColorMap[label];
}
function textOn(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.62 ? '#1a1a1a' : '#fff';
}

const esc = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
const normName = s => String(s).replace(/\s+/g, ''); // 공백 제거 정규화 키

/* ============================================================
   도식 노선도 데이터
   ============================================================ */
const SCHEM = window.SUBWAY_SCHEMATIC || { w: 1000, h: 1000, stations: {} };
const SVG_W = SCHEM.w, SVG_H = SCHEM.h;
const STATION_NAMES = Object.keys(SCHEM.stations); // 도식에 존재하는 역 이름

// SVG 좌표(x,y, y는 위→아래) → Leaflet CRS.Simple 좌표 [lat,lng] (y 반전)
function schemLatLng(name) {
    const xy = SCHEM.stations[normName(name)];
    return xy ? [SVG_H - xy[1], xy[0]] : null;
}

/* 양피지 질감 배경 오버레이(외부 에셋 없이 SVG feTurbulence 로 생성) */
function parchmentDataUri(w, h) {
    const svg =
        "<svg xmlns='http://www.w3.org/2000/svg' width='" + w + "' height='" + h + "'>" +
            "<defs>" +
                "<radialGradient id='v' cx='42%' cy='34%' r='80%'>" +
                    "<stop offset='0%' stop-color='#f2e6c6'/>" +
                    "<stop offset='55%' stop-color='#e4d2a7'/>" +
                    "<stop offset='100%' stop-color='#cbac76'/>" +
                "</radialGradient>" +
                "<filter id='grain'>" +
                    "<feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/>" +
                    "<feColorMatrix type='matrix' values='0 0 0 0 0.33  0 0 0 0 0.24  0 0 0 0 0.12  0 0 0 0.10 0'/>" +
                "</filter>" +
                "<filter id='blots'>" +
                    "<feTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='3' seed='7'/>" +
                    "<feColorMatrix type='matrix' values='0 0 0 0 0.30  0 0 0 0 0.20  0 0 0 0 0.09  0 0 0 0.9 -0.45'/>" +
                "</filter>" +
            "</defs>" +
            "<rect width='100%' height='100%' fill='url(#v)'/>" +
            "<rect width='100%' height='100%' filter='url(#blots)' opacity='0.35'/>" +
            "<rect width='100%' height='100%' filter='url(#grain)'/>" +
        "</svg>";
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ============================================================
   상태
   ============================================================ */
let map = null, residentLayer = null, zFit = 0;
let RESIDENTS = [];          // [{person, station, label, ...}]
let NAMES = [];              // 이름 명단('시트1')

/* ============================================================
   거주지 그룹 / 핀 (발자국 마커)
   ============================================================ */
let RESIDENT_GROUPS = [];
const activeLabels = new Set(['집', '루모스', '디멘터']); // 기본: 집·루모스·디멘터 ON (직장 OFF)
function coordsOf(r) { return schemLatLng(r.station); }

function buildGroups() {
    const byPos = {};
    RESIDENTS.forEach(r => {
        if (!activeLabels.has(r.label)) return; // 꺼진 라벨은 제외
        const pos = coordsOf(r);
        if (!pos) return;
        const key = pos[0].toFixed(1) + ',' + pos[1].toFixed(1);
        (byPos[key] = byPos[key] || { pos, entries: [] }).entries.push(r);
    });
    RESIDENT_GROUPS = Object.values(byPos);
}
// 디멘터가 아닌(=이름 박스에 들어갈) 엔트리만
function normalEntries(g) { return g.entries.filter(e => !isDementor(e.label)); }
function groupLines(g)  { return [...new Set(normalEntries(g).map(r => r.person))]; } // 핀엔 이름만 (라벨은 색으로 구분)
function groupColor(g)  {
    const labels = new Set(normalEntries(g).map(e => e.label));
    return labels.size === 1 ? labelColor([...labels][0]) : '#6e4f23'; // 혼합이면 짙은 잉크
}
// 발자국 마커 (양피지에 찍힌 잉크 발자국 느낌)
function footHtml(color, fs) {
    const s = Math.max(12, Math.round(fs * 1.25));
    return `<div style="position:absolute;transform:translate(-50%,-50%);font-size:${s}px;line-height:1;
        filter:grayscale(1) sepia(1) saturate(4) hue-rotate(-18deg) brightness(.55) drop-shadow(0 1px 1px rgba(60,40,20,.5));">👣</div>`;
}
// 디멘터 마커 (이름 없이 둥둥 떠다니는 유령). 박스가 없을 땐 skull 을 유령 위에 얹음
function ghostHtml(fs, skull) {
    const s = Math.max(16, Math.round(fs * 1.7));
    return `<div style="position:absolute;transform:translate(-50%,-50%)">
        ${skull || ''}<span class="wg-ghost" style="display:inline-block;cursor:pointer;font-size:${s}px;line-height:1;
            filter:drop-shadow(0 2px 3px rgba(40,30,20,.5));">👻</span></div>`;
}
function fullIcon(color, lines, hasGhost, fs) {
    const padY = Math.max(1, Math.round(fs * 0.16)), padX = padY + 4;
    // 네모칸 상단에 둥둥 떠다니는 해골 (디멘터 역의 박스에만)
    const skullSize = Math.max(11, Math.round(fs * 0.95));
    const skull = hasGhost ? `<div style="position:absolute;bottom:100%;left:50%;transform:translateX(-50%);cursor:pointer">
            <span class="wg-skull" style="display:inline-block;font-size:${skullSize}px;line-height:1;
                filter:drop-shadow(0 1px 1px rgba(40,30,20,.55))">💀</span></div>` : '';
    const names = lines.map(l => `<div>${l}</div>`).join('');
    // 양피지 느낌 네모칸: 손으로 그린 듯한 불규칙 모서리 + 바랜 질감 + 살짝 기울임
    const box = lines.length ? `<div style="position:absolute;transform:translate(-50%,-100%) rotate(-1.6deg);margin-top:-14px;cursor:pointer;
            background:radial-gradient(ellipse at 32% 18%, #f8eecd 0%, #ecdcb2 55%, #ddc99b 100%);color:#3a2a18;
            padding:${padY}px ${padX}px;border:1px solid #4a4a4a;border-left:3px solid ${color};
            border-radius:255px 14px 225px 14px / 16px 225px 16px 240px;
            font-family:'East Sea Dokdo',sans-serif;font-weight:400;font-size:${Math.round(fs * 1.5)}px;white-space:nowrap;line-height:1.15;
            box-shadow:0 2px 6px rgba(60,40,20,.5), inset 0 0 14px rgba(120,85,40,.22);
            text-shadow:0 1px 0 rgba(255,250,235,.45)">${skull}${names}</div>` : '';
    // 박스가 있으면 skull 은 박스 상단에, 박스가 없으면 유령 위에 얹음
    const marker = hasGhost ? ghostHtml(fs, lines.length ? '' : skull) : footHtml(color, fs);
    const html = `<div style="position:relative;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
        ${box}${marker}</div>`;
    return L.divIcon({ html, iconSize: [0, 0], iconAnchor: [0, 0], className: '' });
}

// 줌이 작을수록 모든 라벨이 "다같이" 작아짐 (개별 과축소 없음, 살짝 겹침 허용)
function baseFontForZoom() {
    return Math.max(6, Math.min(16, 11 + (map.getZoom() - zFit) * 2.4));
}
function relayout() {
    if (!residentLayer || !map) return;
    residentLayer.clearLayers();
    const fs = baseFontForZoom(); // 전체 균일 크기
    RESIDENT_GROUPS.forEach(g => {
        const hasGhost = g.entries.some(e => isDementor(e.label)); // 디멘터 있는 역 → 👻
        const station = [...new Set(g.entries.map(e => e.station))].join(', '); // 클릭 팝업용 역 이름
        // 디멘터 마커(👻/💀)는 다른 역 이름 박스에 가리지 않도록 최상단 레이어로
        const m = L.marker(g.pos, { icon: fullIcon(groupColor(g), groupLines(g), hasGhost, fs), zIndexOffset: hasGhost ? 100000 : 1000 });
        // 클릭하면 역 이름 팝업 표시
        m.bindPopup(`<span class="wg-pop-name">📍 ${station}</span>`, { className: 'wg-pop', closeButton: false, offset: [0, -4] });
        m.addTo(residentLayer);
    });
}

function drawResidents() {
    buildGroups();
    relayout();
}

function renderList() {
    document.getElementById('rsList').innerHTML = RESIDENTS.map(r => {
        const ok = !!coordsOf(r);
        return `<li>
            <span class="dot" style="background:${labelColor(r.label)}"></span>
            <span class="grow"><b>${r.person}</b> <span class="tag">${r.label}</span> ${r.station}
                ${ok ? '' : '<span class="err">(노선도에 없는 역)</span>'}</span>
            <button class="sm" onclick="delResident('${esc(r.person)}','${esc(r.label)}')">삭제</button>
        </li>`;
    }).join('');
    document.getElementById('listCount').textContent = RESIDENTS.length ? `(${RESIDENTS.length})` : '';
}
function toggleList() {
    const collapsed = document.getElementById('rsList').classList.toggle('collapsed');
    document.getElementById('listToggle').classList.toggle('collapsed', collapsed);
}

function renderNames() {
    const sel = document.getElementById('rsPerson');
    const cur = sel.value;
    sel.innerHTML = '<option value="">이름 선택</option>' + NAMES.map(n => `<option value="${n}">${n}</option>`).join('');
    if (NAMES.includes(cur)) sel.value = cur;
}
// 라벨 선택 목록은 정해진 것만 노출 (디멘터 등은 선택 불가)
const DEFAULT_LABELS = ['집', '직장', '루모스'];
function renderLabelOptions() {
    const sel = document.getElementById('rsLabel');
    const cur = sel.value;
    sel.innerHTML = '<option value="">라벨 선택</option>' + DEFAULT_LABELS.map(l => `<option value="${l}">${l}</option>`).join('');
    if (DEFAULT_LABELS.includes(cur)) sel.value = cur;
}

// 라벨별 표시 on/off 토글 칩
function renderLabelFilters() {
    const labels = [...new Set(RESIDENTS.map(r => r.label).filter(Boolean))];
    const rank = l => (l === '집' ? 0 : l === '직장' ? 0 : 2);
    labels.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
    document.getElementById('labelFilters').innerHTML = labels.map(l => {
        const on = activeLabels.has(l), c = labelColor(l);
        const style = on ? `background:${c};color:${textOn(c)};border-color:transparent;` : 'background:#f6ecd2;color:#8a7555;';
        const dot = on ? '' : `<span class="d" style="background:${c}"></span>`;
        return `<span class="lf-chip ${on ? 'on' : ''}" style="${style}" onclick="toggleLabel('${esc(l)}')">${dot}${l}</span>`;
    }).join('');
}
function toggleLabel(l) {
    if (activeLabels.has(l)) activeLabels.delete(l); else activeLabels.add(l);
    renderLabelFilters();
    drawResidents();
}

/* ============================================================
   역 검색 자동완성 (도식 역 이름에서 필터 — 호출 없음)
   ============================================================ */
let pickedStation = null; // 역 이름

function onSearchInput() {
    const q = document.getElementById('rsSearch').value.trim();
    const box = document.getElementById('searchResults');
    pickedStation = null;
    syncSaveBtn();
    if (!q) { box.className = 'dropdown'; box.innerHTML = ''; return; }
    const qn = normName(q);
    const hits = STATION_NAMES.filter(n => n.indexOf(qn) !== -1).slice(0, 40);
    if (!hits.length) { box.innerHTML = '<div class="opt muted">검색 결과 없음</div>'; box.className = 'dropdown open'; return; }
    box.innerHTML = hits.map(n => `<div class="opt" onclick="pick('${esc(n)}')">${n}</div>`).join('');
    box.className = 'dropdown open';
}
function pick(name) {
    pickedStation = name;
    document.getElementById('rsSearch').value = name;
    const box = document.getElementById('searchResults');
    box.className = 'dropdown'; box.innerHTML = '';
    syncSaveBtn();
}
function syncSaveBtn() {
    const person = document.getElementById('rsPerson').value.trim();
    const label = document.getElementById('rsLabel').value.trim();
    document.getElementById('saveBtn').disabled = !(person && pickedStation && label);
}
document.getElementById('rsPerson').addEventListener('change', syncSaveBtn);
document.getElementById('rsLabel').addEventListener('change', syncSaveBtn);

/* ============================================================
   서버 통신 (Apps Script = 거주지/명단 저장소)
   ============================================================ */
async function apiGet() {
    let res, text;
    try { res = await fetch(API_URL); }
    catch (e) { throw new Error('네트워크/CORS 차단으로 응답을 못 받았습니다 (' + e.message + ')'); }
    text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch (e) { throw new Error('JSON 이 아닌 응답 (상태 ' + res.status + '). 앞부분: ' + text.slice(0, 150)); }
    if (!data.ok) throw new Error(data.error || '로드 실패');
    return data;
}
async function apiPost(payload) {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ ...payload, token: WRITE_TOKEN }) });
    return res.json();
}
async function reload() {
    const data = await apiGet();
    RESIDENTS = data.residents || [];
    NAMES = data.names || [];
    renderNames();
    renderLabelOptions();
    renderLabelFilters();
    drawResidents();
    renderList();
}
async function saveResident() {
    const person = document.getElementById('rsPerson').value.trim();
    const label  = document.getElementById('rsLabel').value.trim();
    const station = pickedStation;
    if (!person || !station || !label) return;
    const btn = document.getElementById('saveBtn'), msg = document.getElementById('rsMsg');
    btn.disabled = true; msg.textContent = '저장 중…'; msg.className = 'muted';
    try {
        const r = await apiPost({ action: 'saveResident', person, label, station });
        if (!r.ok) throw new Error(r.error);
        document.getElementById('rsSearch').value = '';
        document.getElementById('rsLabel').value = '';
        pickedStation = null;
        msg.textContent = r.updated ? '수정됨(덮어쓰기)' : '저장됨';
        await reload();
    } catch (e) { msg.textContent = e.message; msg.className = 'err'; }
    syncSaveBtn();
}
async function delResident(person, label) {
    if (!confirm(`"${person} · ${label}" 을(를) 삭제할까요?`)) return;
    await apiPost({ action: 'delResident', person, label });
    await reload();
}

/* ============================================================
   시작
   ============================================================ */
function showFatal(msg) {
    const b = document.getElementById('setupBanner');
    b.style.display = 'block';
    b.innerHTML = '⛔ ' + msg;
}

(async function init() {
    if (typeof L === 'undefined' || !L.map) {
        showFatal('지도 라이브러리(Leaflet)를 불러오지 못했습니다. 인터넷/unpkg.com 접근을 확인하세요.');
        return;
    }
    if (!STATION_NAMES.length) {
        showFatal('노선도 데이터(subwaySchematic.js)를 불러오지 못했습니다.');
        return;
    }

    // 도식 노선도(와글의 지도)를 CRS.Simple 위에 깔기
    map = L.map('map', { crs: L.CRS.Simple, minZoom: -5, maxZoom: 3, zoomSnap: 0.25, attributionControl: true });
    const bounds = [[0, 0], [SVG_H, SVG_W]];
    // 1) 양피지 질감 배경: 노선 영역보다 사방 넉넉히(+120%) 확장해 축소해도 잘리지 않게
    const parchBounds = L.latLngBounds(bounds).pad(1.2);
    const pw = parchBounds.getEast() - parchBounds.getWest();
    const ph = parchBounds.getNorth() - parchBounds.getSouth();
    L.imageOverlay(parchmentDataUri(pw, ph), parchBounds, { zIndex: 1, interactive: false }).addTo(map);
    // 2) 세피아 잉크 노선/역 (배경 투명 SVG)
    L.imageOverlay('assets/maraudersmap.svg', bounds, { zIndex: 2, attribution: '노선도 ⓒ Wikimedia Commons · 와글의 지도 테마' }).addTo(map);
    map.fitBounds(bounds);
    map.setMaxBounds(parchBounds);
    zFit = map.getZoom();
    residentLayer = L.layerGroup().addTo(map);
    map.on('zoomend moveend', relayout);
    renderLabelOptions();

    // 거주지/명단(Apps Script)
    if (!API_URL) {
        showFatal('거주지 저장을 쓰려면 <code>waglemap_2027.html</code> 상단 <b>API_URL</b> 을 넣어주세요. (노선도는 설정 없이도 보입니다)');
        return;
    }
    try { await reload(); }
    catch (e) {
        showFatal('거주지/명단 로드 실패 — ' + e.message);
        document.getElementById('rsMsg').textContent = e.message;
        document.getElementById('rsMsg').className = 'err';
    }
})();
</script>
