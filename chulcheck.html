<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출석체크 - 인사이드 와글</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <style>
        /* For Wagle(https://for-wagle.vercel.app/) 메인과 같은 톤 */
        * {
            box-sizing: border-box;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }
        body {
            background-color: #f1f5f9;
            background-image:
                radial-gradient(circle at 15% 10%, rgba(59, 130, 246, 0.18) 0, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(16, 185, 129, 0.15) 0, transparent 40%),
                radial-gradient(circle at 85% 15%, rgba(251, 146, 60, 0.12) 0, transparent 35%);
            background-attachment: fixed;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* 헤더 배너 */
        .hero {
            position: relative;
            padding: 18px 25px 30px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 55%, #60a5fa 100%);
            color: #ffffff;
            overflow: hidden;
        }
        .hero::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 22px;
            background: #ffffff;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }
        .back-link {
            position: relative;
            z-index: 1;
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            margin-bottom: 10px;
        }
        .back-link:hover { color: #ffffff; }
        .hero-icon {
            font-size: 2rem;
            display: inline-block;
            animation: bob 2.4s ease-in-out infinite;
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-4px) rotate(-6deg); }
        }
        .hero h1 {
            margin: 4px 0 4px;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .hero p {
            margin: 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
        }
        .bubble.b1 { width: 120px; height: 120px; top: -40px; right: -30px; }
        .bubble.b2 { width: 60px; height: 60px; top: 50px; right: 70px; }
        .bubble.b3 { width: 24px; height: 24px; top: 24px; right: 150px; }

        .content { padding: 8px 25px 22px; }
        .section-label {
            font-size: 0.78rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 0.04em;
            margin: 18px 2px 10px;
        }
        .content > .section-label:first-child { margin-top: 4px; }

        select {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #1e293b;
            background: #f8fafc;
            appearance: none;
            -webkit-appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, #94a3b8 50%), linear-gradient(135deg, #94a3b8 50%, transparent 50%);
            background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%;
            background-size: 5px 5px;
            background-repeat: no-repeat;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* 포인트 카드: 왼쪽 2026 포인트 / 오른쪽 남은 면제권 (50:50) */
        .point-card {
            display: flex;
            margin-top: 12px;
            padding: 12px 0;
            background: #eff6ff;
            border: 1px solid #dbeafe;
            border-radius: 14px;
        }
        .point-card:empty { display: none; }
        .point-card .stat {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 14px;
            border: none;
            background: none;
            text-align: left;
            font: inherit;
        }
        .point-card .stat + .stat { border-left: 1px solid #bfdbfe; }
        .point-card .icon {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: #dbeafe;
        }
        .point-card .label { display: block; font-size: 0.76rem; color: #60a5fa; font-weight: 600; white-space: nowrap; }
        .point-card .value { display: block; font-size: 1.35rem; font-weight: 800; color: #1d4ed8; letter-spacing: -0.02em; }
        .point-card .value small { font-size: 0.8rem; font-weight: 700; margin-left: 2px; }
        /* 남은 면제권 (누르면 면제권 탭으로) */
        .point-card .ex-stat { cursor: pointer; }
        .point-card .ex-stat .icon { background: #fef3c7; }
        .point-card .ex-stat .value { color: #b45309; }
        .point-card .ex-stat .label { color: #d97706; }

        /* 월 탭 (세그먼트) */
        .month-tabs {
            display: grid;
            grid-template-columns: 1.5fr repeat(6, 1fr);
            gap: 3px;
            padding: 4px;
            background: #f1f5f9;
            border-radius: 12px;
        }
        .month-tab {
            position: relative;
            padding: 8px 0;
            border: none;
            border-radius: 9px;
            background: transparent;
            font-size: 0.82rem;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            transition: background-color 0.15s, color 0.15s, box-shadow 0.15s;
        }
        .month-tab.active {
            background: #ffffff;
            color: #1d4ed8;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
        }
        .month-tab.dirty::after {
            content: "";
            position: absolute;
            top: 4px;
            right: 4px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ef4444;
        }

        /* 항목 섹션 */
        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.78rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 0.04em;
            margin: 20px 2px 10px;
        }
        /* 월 탭의 섹션(오프라인/온라인/활동/총대)은 각각 큰 네모로 한 번 더 묶음 */
        .section.box {
            margin-top: 14px;
            padding: 14px 14px 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
        }
        .section.box .section-head {
            align-items: center;
            margin: 0 0 14px;
            font-size: 1rem;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -0.01em;
        }
        .section.box .chip { background: #ffffff; font-size: 0.78rem; font-weight: 500; }
        .section.box .chip.on { font-weight: 700; }
        .section.box .opt-group .group-name { font-size: 0.78rem; }
        .section.box .chip.on { background: #2563eb; }
        .section.box .opt-groups { background: #ffffff; }
        .section-head .count {
            font-size: 0.72rem;
            font-weight: 800;
            color: #1d4ed8;
            background: #dbeafe;
            padding: 2px 8px;
            border-radius: 999px;
            letter-spacing: 0;
        }
        .chips { display: flex; flex-wrap: wrap; gap: 7px; }

        /* 단일 항목은 칩으로 위에, 책밥1~5·책추천 2명a~c처럼 이름이 같은 항목은 아래 상자에 한 줄씩 */
        .chips + .opt-groups { margin-top: 10px; }
        .opt-groups {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            overflow: hidden;
        }
        .opt-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-top: 1px solid #f1f5f9;
        }
        .opt-groups > :first-child { border-top: none; }
        .opt-group .group-name {
            flex: 0 0 38%;
            min-width: 0;
            font-size: 0.82rem;
            font-weight: 600;
            color: #475569;
            line-height: 1.35;
            word-break: keep-all;
        }
        .opt-group.has-on .group-name { color: #1d4ed8; font-weight: 700; }
        .opt-group .chips { flex: 1; gap: 5px; }
        .chip.mini {
            min-width: 34px;
            padding: 6px 0;
            text-align: center;
        }
        .chip {
            padding: 7px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 999px;
            background: #f8fafc;
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: background-color 0.12s, color 0.12s, border-color 0.12s, transform 0.12s;
        }
        .chip:hover { border-color: #93c5fd; }
        .chip:active { transform: scale(0.96); }
        .chip.on {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
        }
        .empty { font-size: 0.8rem; color: #cbd5e1; }

        /* 면제권 (For Wagle 링크 버튼 모양) */
        .ticket {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 10px 12px 10px 14px;
            margin-bottom: 8px;
        }
        .ticket .icon {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            background: #fef3c7;
        }
        .ticket .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
        .ticket .title { font-weight: 700; font-size: 0.9rem; color: #1e293b; line-height: 1.3; word-break: keep-all; }
        .ticket .from { font-size: 0.74rem; color: #94a3b8; }
        .ticket-use {
            flex-shrink: 0;
            padding: 7px 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .ticket-use:hover { background: #1d4ed8; }
        .ticket-use:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            color: #fff;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
            transition: opacity 0.2s, transform 0.15s;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }
        .status-msg {
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            padding: 10px 0 0;
            min-height: 1px;
        }
        .status-msg:empty { padding: 0; }
        .status-msg.error { color: #ef4444; }
        .status-msg.ok { color: #10b981; font-weight: 700; }

        @media (prefers-reduced-motion: reduce) {
            .hero-icon { animation: none; }
        }
    </style>
    <script src="/js/common.js"></script>
</head>
<body>

<div class="container">
    <header class="hero">
        <span class="bubble b1"></span>
        <span class="bubble b2"></span>
        <span class="bubble b3"></span>
        <a class="back-link" href="https://for-wagle.vercel.app/">← 메인으로</a><br>
        <span class="hero-icon">✅</span>
        <h1>출석체크</h1>
    </header>

    <main class="content">
        <div class="section-label">🙋 와글러</div>
        <select id="cName" onchange="loadRecord()">
            <option value="" disabled selected>명단 불러오는 중...</option>
        </select>

        <div id="recordArea" style="display:none;">
            <div class="point-card" id="cPoint"></div>

            <div class="section-label">📅 월 선택</div>
            <div class="month-tabs" id="monthTabs"></div>
            <div id="sections"></div>

            <button id="cSaveBtn" class="btn" onclick="saveMonth()">저장하기</button>
        </div>
        <div id="cStatus" class="status-msg"></div>
    </main>
</div>

<script>
    const API_CHULCHECK = '/api/chulcheck';
    const MONTHS = [7, 8, 9, 10, 11, 12];
    const SECTIONS = [
        { key: 'offline', label: '🏠 오프라인 프로 포인트' },
        { key: 'online', label: '💻 온라인 프로 포인트' },
        { key: 'activity', label: '🌟 활동 포인트' },
    ];

    let record = null;   // 서버에서 받은 원본 (저장 성공 시 갱신)
    let draft = null;    // 화면에서 고치는 중인 값
    let currentMonth = defaultMonth(); // 'ex'면 면제권 탭
    const EXEMPTION_FROM_LABEL = { point: '2026 포인트 면제권', received: '받았어요 면제권' };

    function defaultMonth() {
        const m = new Date().getMonth() + 1;
        return Math.min(Math.max(m, MONTHS[0]), MONTHS[MONTHS.length - 1]);
    }

    function setStatus(msg, type) {
        const status = document.getElementById('cStatus');
        status.className = 'status-msg' + (type ? ' ' + type : '');
        status.innerText = msg || '';
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ---------- 명단 ----------
    async function loadNames() {
        const select = document.getElementById('cName');
        try {
            const response = await fetch(API_CHULCHECK);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || '명단 불러오기 실패');

            select.innerHTML = '<option value="" disabled selected>이름을 선택하세요</option>' +
                data.names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');

            // 저장된 이름이 있으면 자동으로 채워줌 (/js/common.js)
            const savedName = Wagle.saved.getName();
            if (data.names.includes(savedName)) {
                select.value = savedName;
                loadRecord();
            }
        } catch (err) {
            select.innerHTML = '<option value="" disabled selected>명단을 불러오지 못했어요</option>';
            setStatus(err.message, 'error');
        }
    }

    // ---------- 한 사람의 7~12월 기록 전체 ----------
    async function loadRecord() {
        const name = document.getElementById('cName').value;
        if (!name) return;
        if (draft && MONTHS.some(isDirty) && !confirm('저장하지 않은 변경사항이 있어요. 다른 사람으로 바꿀까요?')) {
            document.getElementById('cName').value = record.name;
            return;
        }

        document.getElementById('recordArea').style.display = 'none';
        setStatus('기록 불러오는 중...');
        try {
            const response = await fetch(`${API_CHULCHECK}?${new URLSearchParams({ name })}`);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || '불러오기 실패');

            record = data;
            draft = structuredClone(data.months);
            renderPoint(data.point);
            document.getElementById('recordArea').style.display = '';
            setStatus('');
            render();
        } catch (err) {
            setStatus(err.message, 'error');
        }
    }

    function renderPoint(point) {
        document.getElementById('cPoint').innerHTML = point == null ? '' : `
            <div class="stat">
                <span class="icon">🏅</span>
                <span><span class="label">2026 포인트</span><span class="value">${Number(point).toLocaleString()}<small>점</small></span></span>
            </div>
            <button class="stat ex-stat" onclick="selectMonth('ex')">
                <span class="icon">🎫</span>
                <span><span class="label">남은 면제권</span><span class="value">${record.exemptions.owned.length}<small>개</small></span></span>
            </button>`;
    }

    // 원본과 비교해서 바뀐 달인지 (선택 순서는 무시)
    function snapshot(month) {
        return JSON.stringify(SECTIONS.map(({ key }) => month[key] ? [...month[key].selected].sort() : null)
            .concat([month.chongdae]));
    }
    function isDirty(m) {
        return snapshot(draft[m]) !== snapshot(record.months[m]);
    }

    // ---------- 화면 그리기 ----------
    function render() {
        document.getElementById('monthTabs').innerHTML =
            `<button class="month-tab${currentMonth === 'ex' ? ' active' : ''}" onclick="selectMonth('ex')">🎫 면제권</button>` +
            MONTHS.map(m => `
            <button class="month-tab${m === currentMonth ? ' active' : ''}${isDirty(m) ? ' dirty' : ''}"
                    onclick="selectMonth(${m})">${m}월</button>`).join('');

        const saveBtn = document.getElementById('cSaveBtn');
        if (currentMonth === 'ex') {
            document.getElementById('sections').innerHTML = renderExemptions();
            saveBtn.style.display = 'none';
            return;
        }
        saveBtn.style.display = '';

        const month = draft[currentMonth];
        let html = SECTIONS.map(({ key, label }) => {
            const sec = month[key];
            if (!sec) return '';
            return `
                <div class="section box">
                    <div class="section-head"><span>${label}</span><span class="count">${sec.selected.length}개</span></div>
                    ${sec.options.length ? renderOptions(key, sec) : '<span class="empty">선택할 수 있는 항목이 없어요</span>'}
                </div>`;
        }).join('');

        if (month.chongdae.some(v => v !== null)) {
            html += `
                <div class="section box">
                    <div class="section-head"><span>🚩 총대</span><span class="count">${month.chongdae.filter(Boolean).length}회</span></div>
                    <div class="opt-groups">
                        <div class="opt-group${month.chongdae.some(Boolean) ? ' has-on' : ''}">
                            <span class="group-name">총대</span>
                            <div class="chips">${month.chongdae.map((v, i) => v === null ? '' : `
                                <button class="chip mini${v ? ' on' : ''}" onclick="toggleChongdae(${i})">${i + 1}</button>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        document.getElementById('sections').innerHTML = html;
        saveBtn.disabled = !isDirty(currentMonth);
    }

    // "책밥3" → ["책밥", "3"], "책추천 2명a" → ["책추천 2명", "a"]
    function splitOption(opt) {
        const m = opt.match(/^(.*?\S)\s?(\d{1,2}|[a-z])$/);
        return m ? [m[1], m[2]] : [opt, null];
    }

    // 단일 항목은 칩으로 먼저, 이름이 같은 항목이 2개 이상이면 아래 상자에 한 줄로 묶음
    function renderOptions(key, sec) {
        const groups = new Map();
        sec.options.forEach((opt, i) => {
            const [base, suffix] = splitOption(opt);
            if (!groups.has(base)) groups.set(base, []);
            groups.get(base).push({ opt, i, suffix });
        });
        const isOn = (it) => sec.selected.includes(it.opt);
        const chip = (it, text, mini) => `
            <button class="chip${mini ? ' mini' : ''}${isOn(it) ? ' on' : ''}"
                    onclick="toggleOption('${key}', ${it.i})">${escapeHtml(text)}</button>`;

        const singles = [];
        const rows = [];
        groups.forEach((items, base) => {
            if (items.length < 2 || items.some(it => it.suffix === null)) {
                items.forEach(it => singles.push(chip(it, it.opt)));
                return;
            }
            items.sort((a, b) => a.suffix.localeCompare(b.suffix, 'ko', { numeric: true }));
            rows.push(`
                <div class="opt-group${items.some(isOn) ? ' has-on' : ''}">
                    <span class="group-name">${escapeHtml(base)}</span>
                    <div class="chips">${items.map(it => chip(it, it.suffix, true)).join('')}</div>
                </div>`);
        });

        return (singles.length ? `<div class="chips">${singles.join('')}</div>` : '')
            + (rows.length ? `<div class="opt-groups">${rows.join('')}</div>` : '');
    }

    function renderExemptions() {
        const { owned } = record.exemptions;
        const ownedHtml = owned.length
            ? owned.map((t, i) => `
                <div class="ticket">
                    <span class="icon">🎫</span>
                    <span class="text"><span class="title">${escapeHtml(t.name)}</span><span class="from">${EXEMPTION_FROM_LABEL[t.from]}</span></span>
                    <button class="ticket-use" onclick="useExemption(${i}, this)">사용</button>
                </div>`).join('')
            : '<span class="empty">사용할 수 있는 면제권이 없어요</span>';
        return `
            <div class="section">
                <div class="section-head"><span>🎫 가지고 있는 면제권</span><span class="count">${owned.length}개</span></div>
                ${ownedHtml}
            </div>`;
    }

    // ---------- 면제권 사용 (바로 저장, "사용했어요 면제권"으로 이동) ----------
    async function useExemption(i, btn) {
        const ticket = record.exemptions.owned[i];
        if (!confirm(`'${ticket.name}'을(를) 사용할까요?\n사용하면 "사용했어요 면제권"으로 옮겨져요.`)) return;

        document.querySelectorAll('.ticket-use').forEach(b => { b.disabled = true; });
        btn.innerText = '사용 중...';
        setStatus('');
        try {
            const response = await fetch(API_CHULCHECK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'useExemption', name: record.name, ticket: ticket.name, from: ticket.from }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || '사용 실패');

            Wagle.saved.save('', record.name);
            record.exemptions = data.exemptions;
            renderPoint(data.point);
            setStatus(`'${ticket.name}' 사용 완료 ✅`, 'ok');
        } catch (err) {
            setStatus(err.message, 'error');
        } finally {
            render();
        }
    }

    function selectMonth(m) {
        currentMonth = m;
        setStatus('');
        render();
    }

    function toggleOption(key, i) {
        const sec = draft[currentMonth][key];
        const opt = sec.options[i];
        sec.selected = sec.selected.includes(opt)
            ? sec.selected.filter(v => v !== opt)
            : [...sec.selected, opt];
        render();
    }

    function toggleChongdae(i) {
        const arr = draft[currentMonth].chongdae;
        arr[i] = !arr[i];
        render();
    }

    // ---------- 저장 (선택한 달만) ----------
    async function saveMonth() {
        const name = record.name;
        const m = currentMonth;
        const month = draft[m];
        const btn = document.getElementById('cSaveBtn');

        btn.disabled = true;
        btn.innerText = '저장 중...';
        setStatus('');

        try {
            const response = await fetch(API_CHULCHECK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name,
                    month: m,
                    offline: month.offline?.selected,
                    online: month.online?.selected,
                    activity: month.activity?.selected,
                    chongdae: month.chongdae,
                }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || '저장 실패');

            Wagle.saved.save('', name);

            record.months[m] = data.record;
            draft[m] = structuredClone(data.record);
            renderPoint(data.point);
            setStatus(`${m}월 기록 저장 완료 ✅`, 'ok');
        } catch (err) {
            setStatus(err.message, 'error');
        } finally {
            btn.innerText = '저장하기';
            render();
        }
    }

    window.addEventListener('beforeunload', (e) => {
        if (draft && MONTHS.some(isDirty)) e.preventDefault();
    });

    loadNames();
</script>

</body>
</html>
