<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 점수 전광판 - 인사이드 와글</title>
    <meta name="og:description" content="🏆 와글 팀별 점수 전광판">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #37352f;
            padding: 20px 15px 40px;
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 10%, #fff6e0 0%, #fdfbf7 40%, #f3f0ff 100%);
        }
        .wrap {
            max-width: 560px;
            margin: 0 auto;
        }
        .back-link {
            font-size: 12px;
            color: #9b8fc7;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 10px;
        }
        .title {
            text-align: center;
            margin-bottom: 4px;
        }
        .title .emoji { font-size: 40px; }
        .title h1 {
            margin: 4px 0 2px;
            font-size: 22px;
            color: #4a3f8a;
            letter-spacing: -0.3px;
        }
        .title .sub {
            font-size: 12px;
            color: #9b8fc7;
            font-weight: 500;
        }
        .updated {
            text-align: center;
            font-size: 11px;
            color: #b7afd6;
            margin: 6px 0 18px;
        }

        .board { display: flex; flex-direction: column; gap: 12px; }

        .team-row {
            position: relative;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: 0 8px 22px rgba(108, 92, 231, 0.10);
            border: 2px solid #ffffff;
            overflow: hidden;
            animation: pop 0.4s ease both;
        }
        @keyframes pop {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .team-head {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .rank {
            font-size: 18px;
            font-weight: 800;
            width: 30px;
            text-align: center;
            flex-shrink: 0;
        }
        .team-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
            flex-shrink: 0;
        }
        .bar-track {
            flex: 1;
            background: #efecf8;
            border-radius: 8px;
            height: 22px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0;
            border-radius: 8px;
            transition: width 1.1s cubic-bezier(.22,1,.36,1);
        }
        .score {
            font-size: 24px;
            font-weight: 900;
            color: #37352f;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }
        .count {
            position: relative;
            z-index: 1;
            margin: 6px 0 0 40px;
            font-size: 11px;
            color: #a79fc6;
        }

        .status-msg {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            padding: 40px 0;
        }
        .status-msg.error { color: #c0392b; }
    </style>
</head>
<body>
    <div class="wrap">
        <a class="back-link" href="index.html">← 메인으로</a>
        <div class="title">
            <div class="emoji">🏆</div>
            <h1>팀 점수 전광판</h1>
            <div class="sub">2026 하반기 인사이드 와글</div>
        </div>
        <div class="updated" id="updated"></div>
        <div class="board" id="board">
            <div class="status-msg">점수 불러오는 중…</div>
        </div>
    </div>

    <script>
        const API_TEAM_SCORES = '/api/teamScores';

        // 팀 이름 → 색상 (DB에 "생글이팀"처럼 들어오거나 "생글이"로 들어와도 매칭)
        const TEAM_COLORS = {
            '생글이': '#f5c33b', // 노랑
            '당당이': '#8fce5a', // 연두
            '불끈이': '#e86a6a', // 빨강
            '포근이': '#5aa0e6', // 파랑/하늘
            '중심이': '#9b7ff0', // 보라
        };
        const MEDALS = ['🥇', '🥈', '🥉'];

        function colorFor(teamName) {
            const key = Object.keys(TEAM_COLORS).find((k) => teamName.includes(k));
            return key ? TEAM_COLORS[key] : '#6c5ce7';
        }

        function render(teams) {
            const board = document.getElementById('board');
            if (!Array.isArray(teams) || teams.length === 0) {
                board.innerHTML = '<div class="status-msg">아직 집계된 팀 점수가 없어요.</div>';
                return;
            }
            const max = Math.max(...teams.map((t) => t.total), 1);
            board.innerHTML = '';
            teams.forEach((t, i) => {
                const color = colorFor(t.team);
                const rankLabel = MEDALS[i] || (i + 1);

                const row = document.createElement('div');
                row.className = 'team-row';
                row.style.animationDelay = (i * 0.07) + 's';
                row.innerHTML = `
                    <div class="team-head">
                        <div class="rank">${rankLabel}</div>
                        <div class="team-name" style="color:${color}">${t.team}</div>
                        <div class="bar-track"><div class="bar-fill" style="background:${color}"></div></div>
                        <div class="score">${t.total.toLocaleString()}</div>
                    </div>
                    <div class="count">${t.memberCount}명</div>
                `;
                board.appendChild(row);
                // 막대는 렌더 직후 폭을 줘서 애니메이션이 돌게 함
                requestAnimationFrame(() => {
                    row.querySelector('.bar-fill').style.width = ((t.total / max) * 100) + '%';
                });
            });
        }

        async function load() {
            try {
                const res = await fetch(API_TEAM_SCORES);
                const ct = res.headers.get('content-type') || '';
                if (!ct.includes('application/json')) {
                    // /api/teamScores 가 아직 배포/구동 안 되면 HTML(404 등)이 와서 JSON 파싱이 터짐
                    throw new Error('API 응답이 JSON이 아니에요. /api/teamScores 가 배포/구동 중인지 확인해주세요. (로컬은 vercel dev, 또는 Vercel 배포 필요)');
                }
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '불러오기 실패');
                render(data);
                const now = new Date();
                document.getElementById('updated').textContent =
                    '업데이트: ' + now.toLocaleTimeString('ko-KR');
            } catch (err) {
                document.getElementById('board').innerHTML =
                    `<div class="status-msg error">${err.message}</div>`;
            }
        }

        load();
        // 10분마다 자동 새로고침 (전광판용)
        setInterval(load, 600000);
    </script>
</body>
</html>
