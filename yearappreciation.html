    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --gold: #d4af37;
            --gold-soft: #f0d98c;

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 15%, rgba(123,75,201,0.28), transparent 45%),

            margin: 0;

        /* 신비로운 별/달 장식 */
        .float-mystic {

            align-items: center;

            animation-timing-function: ease-in-out;

            animation-direction: alternate;

        @keyframes floaty {
            0%   { transform: translateY(0px) translateX(0px) rotate(0deg); }

        }

        .roulette-wrapper {

        .pointer {

<script>
    // 신비로운 별/달/구슬 장식
    const mysticEmojis = ['✨', '🌙', '⭐', '🔮', '🪄', '💫'];
    for (let i = 0; i < 24; i++) {
        const el = document.createElement('div');

        el.style.opacity = (0.3 + Math.random() * 0.4).toFixed(2);
        el.style.animationDuration = (3 + Math.random() * 2.5) + 's';
        el.style.animationDelay = (Math.random() * 2) + 's';

    // 유머용 가짜 실시간 접속자 수 (진짜 데이터 아님, 그냥 놀리는 용도)
    setInterval(() => {

        if (el) el.innerText = 20 + Math.floor(Math.random() * 60);
    }, 2500);
</script>

<script>
    // insidemacau.html과 동일한 엑셀 간이 DB(Google Apps Script)로 기록 연결
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwyzlkpeDPTwbziFoU9ikadhHS_xvCETkNuJ6E3BQA43gxg91dxKKqhCNRWxkl6EF5G/exec";

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const userNameInput = document.getElementById('userName');

    // 저장된 이름이 있으면 자동으로 채워줌 (/js/common.js)
    if (typeof Wagle !== 'undefined' && Wagle.saved) {
        const savedName = Wagle.saved.getName();
        if (savedName && [...userNameInput.options].some(o => o.value === savedName)) {
            userNameInput.value = savedName;
        }
    }

    // 타로/금빛 톤에 맞춘 색 조합 (보라 ~ 금색)
    // weight = 당첨 확률(%), draw = 룰렛에서 칸이 차지하는 시각적 크기(상대값)
    // 면제권은 양쪽(반대편)에 15%씩 두 조각으로 배치, 친필싸인 칸은 살짝 더 작게(draw 0.6)
    const slices = [
        { name: "온라인프로그램 면제권", lines: ["온라인프로그램", "면제권"], weight: 28, draw: 1, color1: "#7b4bc9", color2: "#3a1d6e" },
        { name: "원하는 혜택 골라골라", lines: ["원하는 혜택", "골라골라"], weight: 30, draw: 1, color1: "#a66bff", color2: "#5a2fa0" },
        { name: "원하는 책으로 온라인 프로", lines: ["원하는 책으로", "온라인 프로"], weight: 20, draw: 1, color1: "#d4af37", color2: "#9a7b1e" },
        { name: "호그와트 수석입학증서", lines: ["호그와트", "수석입학증서"], weight: 6, draw: 1, color1: "#c9a84b", color2: "#6e4fa0" },
        { name: "온라인프로그램 면제권", lines: ["온라인프로그램", "면제권"], weight: 15, draw: 1, color1: "#7b4bc9", color2: "#3a1d6e" },
        { name: "도스토예프스키 친필싸인", lines: ["도스토예프스키", "친필싸인"], weight: 1, draw: 1.7, color1: "#f0d98c", color2: "#d4af37" }
    ];

    const totalWeight = slices.reduce((sum, slice) => sum + slice.weight, 0);
    const totalDraw = slices.reduce((sum, slice) => sum + slice.draw, 0);
    let currentRotation = 0;
    let isSpinning = false;

    function drawWheel() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = canvas.width / 2;

        let startAngle = -Math.PI / 2;

        // 칸 크기는 draw값(시각 크기)으로 그린다. 당첨 확률(weight)과는 무관하게 계산.
        for (let i = 0; i < slices.length; i++) {
            const sliceAngle = (slices[i].draw / totalDraw) * 2 * Math.PI;
            const endAngle = startAngle + sliceAngle;

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.closePath();

            const midAngle = startAngle + sliceAngle / 2;
            const edgeX = centerX + Math.cos(midAngle) * radius;
            const edgeY = centerY + Math.sin(midAngle) * radius;

            const gradient = ctx.createLinearGradient(centerX, centerY, edgeX, edgeY);
            gradient.addColorStop(0, slices[i].color1);
            gradient.addColorStop(1, slices[i].color2);

            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(212,175,55,0.9)"; // 금색 구분선
            ctx.stroke();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(startAngle + sliceAngle / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff8e6";

            // 칸이 작은 조각(친필싸인 등)은 글자도 살짝 작게
            const fontSize = slices[i].draw < 1 ? 15 : 19;
            ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
            ctx.shadowColor = "rgba(0,0,0,0.7)";
            ctx.shadowBlur = 4;

            if (slices[i].lines) {
                if (slices[i].lines[0] === "호그와트") {
                    // "호그와트" 글자만 블러 처리
                    ctx.save();
                    ctx.filter = "blur(4px)";
                    ctx.fillText(slices[i].lines[0], radius - 15, -8);
                    ctx.restore();
                } else {
                    ctx.fillText(slices[i].lines[0], radius - 15, -8);
                }
                ctx.fillText(slices[i].lines[1], radius - 15, 15);
            } else {
                ctx.fillText(slices[i].name, radius - 15, 4);
            }

            ctx.restore();

            startAngle = endAngle;
        }
    }
    drawWheel();

    // 돌린 사람들 기록 불러오기 (운명룰렛 전용 탭 / yearList 액션)
    async function loadRecords() {
        try {
            const response = await fetch(`${GAS_URL}?action=yearList&t=${Date.now()}`, { cache: 'no-store' });
            const records = await response.json();
            const list = document.getElementById('recordList');
            list.innerHTML = '';

            if (!Array.isArray(records) || records.length === 0) {
                list.innerHTML = '<li>아직 아무도 없습니다!</li>';
                return;
            }

            records.forEach((r, index) => {
                const li = document.createElement('li');
                const icon = index === 0 ? '🔥' : '🎲';
                li.innerHTML = `<span>${icon} ${r.name}</span> <span>${r.result || ''}</span>`;
                list.appendChild(li);
            });
        } catch (error) {
            console.error("기록 로드 실패:", error);
            document.getElementById('recordList').innerHTML = '<li>기록을 불러오지 못했습니다.</li>';
        }
    }
    loadRecords();

    // 가중치 기반으로 당첨 조각을 클라이언트에서 결정
    function pickWinningIndex() {
        let r = Math.random() * totalWeight;
        for (let i = 0; i < slices.length; i++) {
            r -= slices[i].weight;
            if (r < 0) return i;
        }
        return slices.length - 1;
    }

    function spin() {
        if (isSpinning) return;

        const rawName = userNameInput.value.trim();

        if (!rawName) {
            alert("이름을 먼저 선택해주세요!");
            return;
        }

        const userName = rawName; // 하루용 룰렛이라 날짜 없이 이름만 기록

        isSpinning = true;

        const spinBtn = document.getElementById('spinBtn');
        spinBtn.disabled = true;

        // 팀은 optgroup 라벨에서 꺼내 저장 (insidemacau와 동일 형식)
        if (typeof Wagle !== 'undefined' && Wagle.saved) {
            const teamLabel = userNameInput.selectedOptions[0].parentElement.label || '';
            Wagle.saved.save(teamLabel.split(' ').pop(), rawName);
        }

        const winningIndex = pickWinningIndex();
        const prize = slices[winningIndex].name;
        const baseSpins = 360 * 5;

        // 결과를 엑셀 간이 DB(운명룰렛 탭)에 기록 (이름 + 상품명)
        fetch(`${GAS_URL}?action=yearRecord&name=${encodeURIComponent(userName)}&result=${encodeURIComponent(prize)}`, { cache: 'no-store' })
            .catch(err => console.error("기록 저장 실패:", err));

        // 포인터(위쪽)가 가리킬, 당첨 조각 중앙까지의 각도 (draw값 기준 = 실제 그려진 위치)
        let angleToCenter = 0;
        for (let i = 0; i < winningIndex; i++) {
            angleToCenter += (slices[i].draw / totalDraw) * 360;
        }
        angleToCenter += ((slices[winningIndex].draw / totalDraw) * 360) / 2;

        // 직전 스핀의 잔여각이 남지 않도록 '절대 각도'를 먼저 구하고
        // 최소 5바퀴를 채우는 만큼만 더해 앞으로 돌린다.
        const targetAngle = ((-angleToCenter % 360) + 360) % 360;
        const minRotation = currentRotation + baseSpins;
        currentRotation = minRotation + (((targetAngle - minRotation) % 360) + 360) % 360;

        canvas.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            alert(`🔮 [${userName}]님의 운명이 정해졌습니다! [${prize}] 당첨!`);
            loadRecords();
            isSpinning = false;
            spinBtn.disabled = false;
        }, 4000);
    }
</script>
