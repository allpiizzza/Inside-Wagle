<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책후기 등록 - 기억구슬 자판기</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fdfbf7;
            color: #37352f;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .vending-machine {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #edece9;
            width: 100%;
            max-width: 340px;
            box-sizing: border-box;
        }
        .storage-room {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #edece9;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }
        h3 {
            margin-top: 0;
            margin-bottom: 5px;
            text-align: center;
            font-size: 16px;
            color: #222;
        }
        .subtitle {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-bottom: 15px;
        }
        .name-input-container, .book-title-container {
            margin-bottom: 12px;
        }
        .name-input, .book-title-input {
            width: 100%;
            border: none;
            border-bottom: 2px solid #edece9;
            padding: 6px 4px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            text-align-last: center;
            color: #222;
            background-color: transparent;
            box-sizing: border-box;
        }
        .name-input:focus, .book-title-input:focus {
            outline: none;
            border-bottom-color: #37352f;
        }
        .display-zone {
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #f9f9f6 0%, #edece9 100%);
            border-radius: 12px;
            margin-bottom: 15px;
            position: relative;
            border: 1px dashed #d3d2ce;
        }
        .marble {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #f0f0f0;
            box-shadow: inset -8px -8px 20px rgba(0,0,0,0.15), inset 8px 8px 15px rgba(255,255,255,0.7);
            transition: all 0.4s ease;
            transform: scale(0);
            position: relative;
        }
        .marble.active { transform: scale(1); }
        .marble::after {
            content: ''; position: absolute; top: 10px; left: 10px; width: 18px; height: 10px;
            background: rgba(255, 255, 255, 0.6); border-radius: 50%; transform: rotate(-15deg); filter: blur(0.5px);
        }
        .emotion-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 15px;
        }
        .emotion-item input { display: none; }
        .emotion-item label {
            display: flex; align-items: center; padding: 6px 8px; border-radius: 8px;
            border: 1px solid #edece9; font-size: 12px; cursor: pointer; background: #fff;
        }
        .emotion-item input:checked + label { font-weight: bold; color: #fff; border-color: transparent; }

        .emo-joy label { border-left: 3px solid #ffd700; } .emo-joy input:checked + label { background-color: #ffd700; color: #333; }
        .emo-sad label { border-left: 3px solid #4a90e2; } .emo-sad input:checked + label { background-color: #4a90e2; }
        .emo-anger label { border-left: 3px solid #e15b64; } .emo-anger input:checked + label { background-color: #e15b64; }
        .emo-fear label { border-left: 3px solid #a370f7; } .emo-fear input:checked + label { background-color: #a370f7; }
        .emo-disgust label { border-left: 3px solid #5cb85c; } .emo-disgust input:checked + label { background-color: #5cb85c; }
        .emo-touch label { border-left: 3px solid #ff7675; } .emo-touch input:checked + label { background-color: #ff7675; }
        .emo-cozy label { border-left: 3px solid #e1b12c; } .emo-cozy input:checked + label { background-color: #e1b12c; }
        .emo-curious label { border-left: 3px solid #00cec9; } .emo-curious input:checked + label { background-color: #00cec9; }
        .emo-empty label { border-left: 3px solid #636e72; } .emo-empty input:checked + label { background-color: #636e72; }
        .emo-love label { border-left: 3px solid #fd79a8; } .emo-love input:checked + label { background-color: #fd79a8; }

        .btn-group { display: flex; gap: 8px; }
        .btn {
            flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .btn-dispense { background: #37352f; color: #fff; }
        .btn-save { background: #ffb300; color: #fff; display: none; }
        .btn:disabled { background: #e2e1de; color: #a09f9c; cursor: not-allowed; }

        .storage-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px 8px;
            margin-top: 4px;
            min-height: 50px;
            max-height: 460px;
            overflow-y: auto;
            padding: 4px 6px 4px 2px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.3) transparent;
        }
        .storage-grid::-webkit-scrollbar {
            width: 5px;
        }
        .storage-grid::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 10px;
        }
        .team-tabs {
            display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center;
        }
        .team-tab {
            --team-color: #999;
            border: 1.5px solid var(--team-color);
            color: var(--team-color);
            background: #fff;
            border-radius: 16px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .team-tab.active {
            background: var(--team-color);
            color: #fff;
            box-shadow: 0 3px 10px color-mix(in srgb, var(--team-color) 50%, transparent);
        }
        .tower-panel {
            border-radius: 16px;
            padding: 22px 16px;
            transition: background 0.4s ease;
            min-height: 160px;
        }
        .tower-header {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 12px;
            opacity: 0.9;
            letter-spacing: 0.3px;
        }
        .tower-panel .storage-status {
            color: rgba(255, 255, 255, 0.55);
        }
        .tower-panel .saved-title {
            color: #fff;
        }
        .tower-panel .saved-name {
            color: rgba(255, 255, 255, 0.55);
        }
        .tower-panel .mini-marble {
            box-shadow: inset -5px -5px 12px rgba(0,0,0,0.35), inset 5px 5px 10px rgba(255,255,255,0.5), 0 0 14px rgba(255,255,255,0.25);
        }
        .saved-marble-box {
            display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; cursor: pointer;
        }
        .mini-marble {
            width: 40px; height: 40px; border-radius: 50%; box-shadow: inset -5px -5px 12px rgba(0,0,0,0.2), inset 5px 5px 10px rgba(255,255,255,0.6), 0 4px 8px rgba(0,0,0,0.1);
            position: relative; transition: transform 0.2s; margin: 0 auto;
        }
        .mini-marble:hover { transform: scale(1.15); }
        .mini-marble::after {
            content: ''; position: absolute; top: 5px; left: 5px; width: 9px; height: 4px; background: rgba(255, 255, 255, 0.6); border-radius: 50%; transform: rotate(-15deg);
        }
        .saved-title {
            font-size: 9px; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #555;
            font-weight: 500;
        }
        .saved-name {
            font-size: 8px; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #999;
        }
        .delete-btn {
            position: absolute; top: -4px; right: -4px; width: 14px; height: 14px; background: rgba(0,0,0,0.6); color: #fff; border-radius: 50%; font-size: 9px; line-height: 14px; text-align: center; display: none;
        }
        .saved-marble-box:hover .delete-btn { display: block; }
        .storage-status { font-size: 12px; color: #aaa; text-align: center; }
    </style>
</head>
<body>

<div class="vending-machine">
    <h3>🔮 기억구슬 자판기</h3>
    <div class="subtitle">감정을 고르고 구슬을 제조하세요!</div>

    <div class="name-input-container">
        <select id="userName" class="name-input">
            <option value="" disabled selected>불러오는 중...</option>
        </select>
    </div>

    <div class="book-title-container">
        <input type="text" id="bookTitle" class="book-title-input" placeholder="📖 책 제목을 입력하세요" maxlength="30">
    </div>

    <div class="display-zone">
        <div id="marbleEffect" class="marble"></div>
    </div>

    <div class="emotion-grid">
        <div class="emotion-item emo-joy"><input type="checkbox" id="emo1" value="기쁨/유쾌" onchange="checkLimit(this)"><label for="emo1">💛 기쁨/유쾌</label></div>
        <div class="emotion-item emo-sad"><input type="checkbox" id="emo2" value="슬픔/여운" onchange="checkLimit(this)"><label for="emo2">💙 슬픔/여운</label></div>
        <div class="emotion-item emo-anger"><input type="checkbox" id="emo3" value="분노/답답" onchange="checkLimit(this)"><label for="emo3">❤️ 분노/답답</label></div>
        <div class="emotion-item emo-fear"><input type="checkbox" id="emo4" value="스릴/소름" onchange="checkLimit(this)"><label for="emo4">💜 스릴/소름</label></div>
        <div class="emotion-item emo-disgust"><input type="checkbox" id="emo5" value="까칠/찝찝" onchange="checkLimit(this)"><label for="emo5">💚 까칠/찝찝</label></div>
        <div class="emotion-item emo-touch"><input type="checkbox" id="emo6" value="뭉클/감동" onchange="checkLimit(this)"><label for="emo6">🌸 뭉클/감동</label></div>
        <div class="emotion-item emo-cozy"><input type="checkbox" id="emo7" value="포근/힐링" onchange="checkLimit(this)"><label for="emo7">🧡 포근/힐링</label></div>
        <div class="emotion-item emo-curious"><input type="checkbox" id="emo8" value="깨달음/지식" onchange="checkLimit(this)"><label for="emo8">🩵 깨달음/지식</label></div>
        <div class="emotion-item emo-empty"><input type="checkbox" id="emo9" value="허무/씁쓸" onchange="checkLimit(this)"><label for="emo9">🩶 허무/씁쓸</label></div>
        <div class="emotion-item emo-love"><input type="checkbox" id="emo10" value="설렘/달달" onchange="checkLimit(this)"><label for="emo10">💖 설렘/달달</label></div>
    </div>

    <div class="btn-group">
        <button id="dispenseBtn" class="btn btn-dispense" onclick="generateMarble()" disabled>구슬 제조 🌟</button>
        <button id="saveBtn" class="btn btn-save" onclick="saveMarble()">보관방 저장 📥</button>
    </div>
</div>

<div class="storage-room">
    <h3>🌌 장기 기억 보관방</h3>
    <div class="subtitle">팀별로 쌓인 기억구슬들을 확인해보세요</div>

    <div class="team-tabs" id="teamTabs"></div>

    <div class="tower-panel" id="towerPanel">
        <div class="tower-header" id="towerHeader"></div>
        <div id="storageStatus" class="storage-status">불러오는 중...</div>
        <div id="storageGrid" class="storage-grid"></div>
    </div>
</div>

<script>
    // Vercel 하나에 프론트+API를 같이 배포하므로 상대경로로 충분해요.
    const API_BASE_URL = '/api/marbles';

    // 감정 이름 -> 색상 매핑 (Notion에는 이름만 저장하고, 색은 여기서 다시 계산합니다)
    const EMOTION_COLORS = {
        '기쁨/유쾌': '#ffd700',
        '슬픔/여운': '#4a90e2',
        '분노/답답': '#e15b64',
        '스릴/소름': '#a370f7',
        '까칠/찝찝': '#5cb85c',
        '뭉클/감동': '#ff7675',
        '포근/힐링': '#e1b12c',
        '깨달음/지식': '#00cec9',
        '허무/씁쓸': '#636e72',
        '설렘/달달': '#fd79a8',
    };

    let currentEmotions = [];
    let currentGradient = '';
    let currentShadow = '';

    function checkLimit(checkbox) {
        const checkboxes = document.querySelectorAll('.emotion-grid input[type="checkbox"]');
        const checkedCount = Array.from(checkboxes).filter(i => i.checked).length;
        if (checkedCount > 3) {
            checkbox.checked = false;
            alert("감정은 최대 3개까지만 고를 수 있어요!");
            return;
        }
        document.getElementById('dispenseBtn').disabled = !(checkedCount >= 1 && checkedCount <= 3);
    }

    function buildGradientFromEmotions(emotions) {
        const colors = emotions.map(e => EMOTION_COLORS[e] || '#cccccc');
        const shadowFrom = colors[0];
        const shadowTo = colors[colors.length - 1];
        let gradient;
        if (colors.length === 1) {
            gradient = `radial-gradient(circle at 30% 30%, #ffffff 0%, ${colors[0]} 70%)`;
        } else if (colors.length === 2) {
            gradient = `linear-gradient(135deg, ${colors[0]} 0%, ${colors[1]} 100%)`;
        } else {
            gradient = `linear-gradient(135deg, ${colors[0]} 0%, ${colors[1]} 50%, ${colors[2]} 100%)`;
        }
        const shadow = `inset -12px -12px 25px rgba(0,0,0,0.25), inset 10px 10px 20px rgba(255,255,255,0.7), 0 0 20px ${shadowFrom}66, 0 0 20px ${shadowTo}66`;
        return { gradient, shadow };
    }

    function generateMarble() {
        const checkboxes = document.querySelectorAll('.emotion-grid input[type="checkbox"]');
        currentEmotions = Array.from(checkboxes).filter(i => i.checked).map(i => i.value);
        const marble = document.getElementById('marbleEffect');

        marble.classList.remove('active');

        setTimeout(() => {
            const { gradient, shadow } = buildGradientFromEmotions(currentEmotions);
            currentGradient = gradient;
            currentShadow = shadow;
            marble.style.background = currentGradient;
            marble.style.boxShadow = currentShadow;
            marble.classList.add('active');
            document.getElementById('saveBtn').style.display = 'block';
        }, 100);
    }

    // Notion DB에 저장 (서버리스 함수 경유)
    async function saveMarble() {
        const nameInput = document.getElementById('userName');
        const titleInput = document.getElementById('bookTitle');
        const name = nameInput.value.trim();
        const title = titleInput.value.trim() || "무제의 기억";

        if (!name) {
            alert("이름을 먼저 선택해주세요!");
            nameInput.focus();
            return;
        }

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        saveBtn.innerText = '저장 중...';

        try {
            const response = await fetch(API_BASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, name, emotions: currentEmotions }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || '저장에 실패했어요.');

            // 폼 초기화
            nameInput.value = '';
            titleInput.value = '';
            document.getElementById('marbleEffect').classList.remove('active');
            saveBtn.style.display = 'none';
            document.querySelectorAll('.emotion-grid input[type="checkbox"]').forEach(i => i.checked = false);
            document.getElementById('dispenseBtn').disabled = true;

            await loadStorage();

            // 방금 만든 구슬의 팀(서버가 와글러 관계형에서 자동으로 채워줌)으로 탭 전환
            const justCreated = allMarbles.find(m => m.id === data.id);
            if (justCreated?.team) {
                selectTeam(justCreated.team);
            }
        } catch (err) {
            alert(`저장 실패: ${err.message}`);
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerText = '보관방 저장 📥';
        }
    }

    // Notion 페이지 archive 처리 (삭제)
    async function deleteMarble(id, e) {
        e.stopPropagation();
        if (!confirm("이 기억구슬을 보관방에서 영구 삭제할까요?")) return;

        try {
            const response = await fetch(`${API_BASE_URL}?id=${encodeURIComponent(id)}`, {
                method: 'DELETE',
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || '삭제에 실패했어요.');
            await loadStorage();
        } catch (err) {
            alert(`삭제 실패: ${err.message}`);
        }
    }

    const TEAMS = [
        { name: '생글이팀', emoji: '💛', color: '#ffd700' },
        { name: '새침이팀', emoji: '💚', color: '#5cb85c' },
        { name: '포근이팀', emoji: '💙', color: '#4a90e2' },
        { name: '중심이팀', emoji: '💜', color: '#a370f7' },
        { name: '불끈이팀', emoji: '❤️', color: '#e15b64' },
    ];

    let allMarbles = [];
    let selectedTeam = TEAMS[0].name;

    function hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function renderTeamTabs() {
        const tabs = document.getElementById('teamTabs');
        tabs.innerHTML = TEAMS.map(t => `
            <button
                class="team-tab ${t.name === selectedTeam ? 'active' : ''}"
                style="--team-color: ${t.color}"
                onclick="selectTeam('${t.name}')"
            >${t.emoji} ${t.name}</button>
        `).join('');
    }

    function selectTeam(name) {
        selectedTeam = name;
        renderTeamTabs();
        renderTower();
    }

    function renderTower() {
        const team = TEAMS.find(t => t.name === selectedTeam);
        const panel = document.getElementById('towerPanel');
        const header = document.getElementById('towerHeader');
        const grid = document.getElementById('storageGrid');
        const status = document.getElementById('storageStatus');

        // 인사이드아웃 기억탑 느낌: 팀 색상이 위에서 은은하게 번지는 어두운 배경
        panel.style.background = `radial-gradient(ellipse at top, ${hexToRgba(team.color, 0.4)} 0%, #241a38 55%, #1a1330 100%)`;

        const filtered = allMarbles.filter(m => m.team === team.name);
        header.innerText = `${team.emoji} ${team.name} · 구슬 ${filtered.length}개`;

        grid.innerHTML = '';
        if (!filtered.length) {
            status.style.display = 'block';
            status.innerText = '아직 이 팀의 구슬이 없어요.';
            return;
        }
        status.style.display = 'none';

        filtered.forEach(m => {
            const { gradient } = buildGradientFromEmotions(m.emotions);
            const box = document.createElement('div');
            box.className = 'saved-marble-box';
            box.onclick = () => alert(`🔮 [${m.title}]\n작성자: ${m.name} (${m.team})\n감정: ${m.emotions.join(', ')}`);

            box.innerHTML = `
                <div class="mini-marble" style="background: ${gradient};"></div>
                <div class="saved-title">${m.title}</div>
                <div class="saved-name">${m.name}</div>
                <div class="delete-btn" onclick="deleteMarble('${m.id}', event)">×</div>
            `;
            grid.appendChild(box);
        });
    }

    // Notion DB에서 목록 불러오기
    async function loadStorage() {
        // 서버 연결이 안 돼있어도 탭/탑 UI는 항상 먼저 보이게 렌더링
        renderTeamTabs();
        renderTower();

        const status = document.getElementById('storageStatus');
        try {
            const response = await fetch(API_BASE_URL);
            const marbles = await response.json();
            if (!response.ok) throw new Error(marbles.error || '불러오기에 실패했어요.');

            allMarbles = marbles;
            renderTower();
        } catch (err) {
            status.style.display = 'block';
            status.innerText = `불러오기 실패: ${err.message} (API_BASE_URL을 확인해주세요)`;
        }
    }

    // 와글러 DB에서 명단(이름+팀) 불러와 드롭다운 채우기
    async function loadWaglerOptions() {
        const select = document.getElementById('userName');
        try {
            const response = await fetch('/api/waglerList');
            const waglers = await response.json();
            if (!response.ok) throw new Error(waglers.error || '명단 불러오기 실패');

            const teams = [...new Set(waglers.map(w => w.team).filter(Boolean))];
            const noTeam = waglers.filter(w => !w.team);

            select.innerHTML = '<option value="" disabled selected>이름을 선택하세요</option>' +
                teams.map(team => `
                    <optgroup label="${team}">
                        ${waglers.filter(w => w.team === team).map(w => `<option value="${w.name}">${w.name}</option>`).join('')}
                    </optgroup>
                `).join('') +
                (noTeam.length ? `<optgroup label="팀 미정">${noTeam.map(w => `<option value="${w.name}">${w.name}</option>`).join('')}</optgroup>` : '');
        } catch (err) {
            select.innerHTML = '<option value="" disabled selected>명단을 불러오지 못했어요</option>';
        }
    }

    window.onload = () => {
        loadWaglerOptions();
        loadStorage();
