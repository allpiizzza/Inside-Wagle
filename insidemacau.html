<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 와글노름꾼</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbit&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Orbit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fdfbf7;
            color: #37352f;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 배경에 떠다니는 금빛 코인들 (index.html의 글로시 구슬과 같은 방식) */
        .float-coin {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation-name: floaty;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes floaty {
            0%   { transform: translateY(0px) translateX(0px) rotate(0deg); }
            100% { transform: translateY(-16px) translateX(6px) rotate(12deg); }
        }

        .card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border: 2px solid #dfb14b;
        }
        .card.neon {
            animation: neonPulse 2.4s ease-in-out infinite;
        }
        h3 {
            margin-top: 0;
            margin-bottom: 5px;
            text-align: center;
            font-size: 24px;
            font-family: 'Orbit', -apple-system, sans-serif;
            color: #b38728;
            text-shadow: 1px 1px 0px #fff, 0 2px 6px rgba(179, 135, 40, 0.25);
        }
        .subtitle {
            font-size: 14px;
            color: #8e6819;
            text-align: center;
            margin-bottom: 18px;
            font-weight: 600;
        }
        .back-link {
            font-size: 13px;
            color: #888;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 4px;
        }
        .field-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .field-row .field {
            flex: 1;
            margin-bottom: 0;
            min-width: 0;
        }
        .field { margin-bottom: 16px; }
        .field label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #555;
            margin-bottom: 6px;
            text-align: center;
        }
        .field input[type="text"],
        .field input[type="date"],
        .field select {
            width: 100%;
            border: 1.5px solid #edece9;
            border-radius: 8px;
            padding: 10px 6px;
            font-size: 16px;
            font-family: inherit;
            color: #222;
            box-sizing: border-box;
            background: #fff;
            text-align: center;
            text-align-last: center;
        }
        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: #e15b64;
        }

        .roulette-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 28px auto 20px auto;
        }
        .pointer {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 38px solid #e15b64;
            z-index: 20;
            filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.25));
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 0 6px #fff, 0 0 0 8px #edece9, 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
        }
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 62px;
            height: 62px;
            background: radial-gradient(circle, #fff 30%, #f1e9c8 100%);
            border: 3px solid #fff;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
        }

        .btn-spin {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Orbit', -apple-system, sans-serif;
            cursor: pointer;
            background: linear-gradient(135deg, #fcf6ba, #dfb14b);
            color: #6b5100;
            box-shadow: 0 6px 16px rgba(223, 177, 75, 0.4);
            transition: transform 0.15s ease, opacity 0.2s;
        }
        .btn-spin:active { transform: scale(0.97); }
        .btn-spin:disabled {
            background: #e2e1de;
            color: #a09f9c;
            box-shadow: none;
            cursor: not-allowed;
        }
        .btn-spin .btn-hint {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-top: 4px;
            opacity: 0.9;
        }
        /* 유머용 수상한 도박사이트 연출 */
        @keyframes neonPulse {
            0%   { border-color: #dfb14b; box-shadow: 0 4px 20px rgba(0,0,0,0.08), 0 0 12px rgba(223,177,75,0.6); }
            33%  { border-color: #e15b64; box-shadow: 0 4px 20px rgba(0,0,0,0.08), 0 0 12px rgba(225,91,100,0.6); }
            66%  { border-color: #6c5ce7; box-shadow: 0 4px 20px rgba(0,0,0,0.08), 0 0 12px rgba(108,92,231,0.6); }
            100% { border-color: #dfb14b; box-shadow: 0 4px 20px rgba(0,0,0,0.08), 0 0 12px rgba(223,177,75,0.6); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .ad-marquee {
            width: 100%;
            max-width: 420px;
            background: #1a1330;
            color: #ffd700;
            font-size: 14px;
            font-weight: 800;
            padding: 6px 0;
            overflow: hidden;
            white-space: nowrap;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(255,215,0,0.4);
        }
        .ad-marquee span {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 11s linear infinite;
        }
        .live-counter {
            font-size: 13px;
            color: #e15b64;
            text-align: center;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .live-counter .dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #e15b64;
            margin-right: 4px;
            animation: blink 1.2s infinite;
        }
        .hot-badge {
            position: absolute;
            top: -10px;
            right: -8px;
            background: linear-gradient(135deg, #ff5f6d, #ffc371);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 9px;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(255, 95, 109, 0.4);
            animation: blink 1s infinite;
            transform: rotate(8deg);
        }
        .trust-footer {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-top: 12px;
            letter-spacing: 0.2px;
        }

        #loading {
            display: none;
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-bottom: 10px;
        }

        .ranking-title {
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Orbit', -apple-system, sans-serif;
            color: #b38728;
            margin-bottom: 10px;
        }
        .ranking-list {
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
        }
        .ranking-list li {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            padding: 8px 2px;
            border-bottom: 1px dashed #f1f0ed;
            color: #555;
        }
        .ranking-list li:last-child { border-bottom: none; }
        .ranking-list li span:last-child {
            color: #e15b64;
            font-weight: 700;
        }
    </style>
</head>

<script>
    // 배경에 떠다니는 금빛 코인들
    const coinEmojis = ['🪙', '💰', '🎲', '🃏', '⭐'];
    for (let i = 0; i < 22; i++) {
        const coin = document.createElement('div');
        coin.className = 'float-coin';
        const size = 20 + Math.random() * 22;
        coin.style.width = size + 'px';
        coin.style.height = size + 'px';
        coin.style.left = Math.random() * 92 + 'vw';
        coin.style.top = Math.random() * 92 + 'vh';
        coin.style.fontSize = (size * 0.7) + 'px';
        coin.style.opacity = (0.4 + Math.random() * 0.35).toFixed(2);
        coin.style.animationDuration = (3 + Math.random() * 2.5) + 's';
        coin.style.animationDelay = (Math.random() * 2) + 's';
        coin.innerText = coinEmojis[Math.floor(Math.random() * coinEmojis.length)];
        document.body.appendChild(coin);
    }

    // 유머용 가짜 실시간 접속자 수 (진짜 데이터 아님, 그냥 놀리는 용도)
    setInterval(() => {
        const el = document.getElementById('liveCount');
        if (el) el.innerText = 20 + Math.floor(Math.random() * 60);
    }, 2500);
</script>

<div class="card">
    <div class="ranking-title">🏆 걸어걸어 🏆</div>
    <div style="font-size: 12px; color: #d63031; font-weight: 700; text-align: center; margin-bottom: 12px;">📌 뽑은 아이템은 본방에 공유하고 즉시 사용 필수!</div>
    <ul class="ranking-list" id="rankingList">
        <li>데이터를 불러오는 중...</li>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwyzlkpeDPTwbziFoU9ikadhHS_xvCETkNuJ6E3BQA43gxg91dxKKqhCNRWxkl6EF5G/exec";

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const userNameInput = document.getElementById('userName');
    const playDateInput = document.getElementById('playDate');

    // 날짜는 오늘 날짜를 기본값으로
    playDateInput.value = new Date().toLocaleDateString('sv-SE');

    // 이름 목록은 fortuneteller.html과 동일하게 하드코딩 (API 호출 없음)
    const savedName = localStorage.getItem('rouletteUserName');
    if (savedName) {
        userNameInput.value = savedName;
    }

    userNameInput.addEventListener('change', (e) => {
        localStorage.setItem('rouletteUserName', e.target.value);
    });

    const slices = [
        { name: "💎 300", weight: 4, color1: "#ff0844", color2: "#ffb199" },
        { name: "👑 200", weight: 4, color1: "#4facfe", color2: "#00f2fe" },
        { name: "🎉 150", weight: 12, color1: "#43e97b", color2: "#38f9d7" },
        { name: "✨ 100", weight: 18, color1: "#f6d365", color2: "#fda085" },
        { name: "🍀 77",  weight: 18, color1: "#c471f5", color2: "#fa71cd" },
        { name: "🚀 50",  weight: 18, color1: "#48c6ef", color2: "#6f86d6" },
        { name: "🎈 7",   weight: 6, color1: "#fccb90", color2: "#d57eeb" },
        { name: "💩 1",   weight: 6, color1: "#f77062", color2: "#fe5196" },

        { name: "북큐1회연속채우기권", lines: ["북큐 1회연속", "채우기권"], weight: 12, color1: "#b224ef", color2: "#7579ff" },
        { name: "프리덤1회연속채우기권", lines: ["프리덤 1회연속", "채우기권"], weight: 12, color1: "#e0c3fc", color2: "#8ec5fc" },
        { name: "하닉오르면한번더~!", lines: ["하닉 오르면", "한번더~!"], weight: 12, color1: "#fa709a", color2: "#fee140" },
        { name: "구립도서관무료입장권", lines: ["구립도서관", "무료입장권"], weight: 12, color1: "#a18cd1", color2: "#fbc2eb" }
    ];

    const totalWeight = slices.reduce((sum, slice) => sum + slice.weight, 0);
    let currentRotation = 0;
    let isSpinning = false;

    function drawWheel() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = canvas.width / 2;

        let startAngle = -Math.PI / 2;

        for (let i = 0; i < slices.length; i++) {
            const sliceAngle = (slices[i].weight / totalWeight) * 2 * Math.PI;
            const endAngle = startAngle + sliceAngle;

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.closePath();

            const midAngle = startAngle + sliceAngle / 2;
            const edgeX = centerX + Math.cos(midAngle) * radius;
            const edgeY = centerY + Math.sin(midAngle) * radius;

            const gradient = ctx.createLinearGradient(centerX, centerY, edgeX, edgeY);
            gradient.addColorStop(0, slices[i].color1);
            gradient.addColorStop(1, slices[i].color2);

            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#fff";
            ctx.stroke();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(startAngle + sliceAngle / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";

            const fontSize = slices[i].weight <= 6 ? 14 : 17;
            ctx.font = `bold ${fontSize}px 'Orbit', -apple-system, sans-serif`;
            ctx.shadowColor = "rgba(0,0,0,0.6)";
            ctx.shadowBlur = 4;

            if (slices[i].lines) {
                ctx.fillText(slices[i].lines[0], radius - 15, -8);
                ctx.fillText(slices[i].lines[1], radius - 15, 15);
            } else {
                ctx.fillText(slices[i].name, radius - 15, 4);
            }

            ctx.restore();

            startAngle = endAngle;
        }
    }
    drawWheel();

    async function loadRankings() {
        try {
            const response = await fetch(`${GAS_URL}?action=getRank&t=${Date.now()}`, { cache: 'no-store' });
            const rankings = await response.json();

            const list = document.getElementById('rankingList');
            list.innerHTML = '';

            if(rankings.length === 0) {
                list.innerHTML = '<li>아직 참여자가 없습니다!</li>';
                return;
            }

            rankings.forEach((r, index) => {
                const li = document.createElement('li');
                let icon = index === 0 ? '🔥' : '🎲';

                let displayScore = isNaN(parseInt(r.scoreText)) ? r.scoreText : `${r.scoreText}점`;

                li.innerHTML = `<span>${icon} ${r.name}</span> <span>${displayScore}</span>`;
                list.appendChild(li);
            });
        } catch (error) {
            console.error("랭킹 로드 실패:", error);
        }
    }

    loadRankings();

    async function spin() {
        const rawName = userNameInput.value.trim();
        const dateValue = playDateInput.value; // YYYY-MM-DD

        if (!rawName) {
            alert("이름을 먼저 선택해주세요!");
            return;
        }
        if (!dateValue) {
            alert("날짜를 먼저 선택해주세요!");
            return;
        }

        const [, mm, dd] = dateValue.split('-');
        const userName = `${mm}${dd} ${rawName}`; // 예: "0801 홍길동"

        if (isSpinning) return;
        isSpinning = true;

        const spinBtn = document.getElementById('spinBtn');
        const loading = document.getElementById('loading');

        spinBtn.disabled = true;
        loading.style.display = 'block';

        try {
            const response = await fetch(`${GAS_URL}?action=spin&name=${encodeURIComponent(userName)}`, { cache: 'no-store' });
            const data = await response.json();

            loading.style.display = 'none';

            if (!data.success) {
                alert(data.message);
                isSpinning = false;
                spinBtn.disabled = false;
                return;
            }

            const winningIndex = data.winningIndex;
            const baseSpins = 360 * 5;

            let angleToCenter = 0;
            for (let i = 0; i < winningIndex; i++) {
                angleToCenter += (slices[i].weight / totalWeight) * 360;
            }
            angleToCenter += ((slices[winningIndex].weight / totalWeight) * 360) / 2;

            const targetRotation = baseSpins - angleToCenter;
            currentRotation += targetRotation;

            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                let msgScore = isNaN(parseInt(data.score)) ? data.score : `${data.score}점`;
                const isItemWin = !!slices[winningIndex].lines;
                const noticeText = isItemWin ? '\n\n📌 뽑은 아이템은 본방에 공유하고 즉시 사용 필수!' : '';
                alert(`🎉 축하합니다! [${userName}]님, ${msgScore} 당첨!${noticeText}`);
                loadRankings();
                isSpinning = false;
                spinBtn.disabled = false;
            }, 4000);

        } catch (error) {
            alert("서버와 통신 중 오류가 발생했습니다. 다시 시도해주세요.");
            loading.style.display = 'none';
            isSpinning = false;
            spinBtn.disabled = false;
        }
    }
</script>

</body>
</html>
